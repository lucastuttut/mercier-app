<!-- ABA ESTOQUE (COM BUSCA E FUNIL) -->
    <main id="view-estoque" class="hidden p-6 max-w-[1950px] mx-auto">
        <!-- FORMULÁRIO DE CADASTRO -->
        <div class="card-premium p-6 border-l-8 border-blue-600 mb-6 flex flex-wrap gap-3 items-end">
            <div class="flex-1 min-w-[200px]">
                <label class="text-[9px] font-black text-slate-400 uppercase">Produto</label>
                <input id="e_produto" placeholder="EX: CADEIRA PARIS" class="border-2 p-2 rounded-lg text-xs font-bold w-full uppercase">
            </div>
            <div class="w-48">
                <label class="text-[9px] font-black text-slate-400 uppercase">Fábrica</label>
                <select id="e_fabrica_select" class="border-2 p-2 rounded-lg text-xs font-bold bg-white w-full"></select>
            </div>
            <div class="w-20">
                <label class="text-[9px] font-black text-slate-400 uppercase">Qtd</label>
                <input id="e_qtd" type="number" value="1" class="border-2 p-2 rounded-lg text-xs font-bold w-full">
            </div>
            <div class="w-32">
                <label class="text-[9px] font-black text-slate-400 uppercase">Situação</label>
                <select id="e_situacao" class="border-2 p-2 rounded-lg text-xs font-bold bg-white w-full">
                    <option value="ESTOQUE">ESTOQUE</option>
                    <option value="VENDIDO">VENDIDO</option>
                </select>
            </div>
            <button onclick="cadastrarEstoque()" class="bg-blue-600 text-white px-6 py-2.5 rounded-lg font-black text-xs uppercase shadow hover:bg-blue-700 transition">Adicionar</button>
        </div>

        <!-- BARRA DE FILTROS (FUNIL) -->
        <div class="card-premium p-4 mb-4 bg-slate-50 flex flex-wrap gap-4 items-center">
            <div class="flex-1">
                <input type="text" id="estoque-busca" onkeyup="renderEstoque()" placeholder="🔍 BUSCAR POR PALAVRA-CHAVE..." class="border-2 p-2 rounded-xl text-xs font-bold w-full uppercase">
            </div>
            <select id="estoque-filtro-fabrica" onchange="renderEstoque()" class="border-2 p-2 rounded-xl text-xs font-bold bg-white w-48">
                <option value="TODAS">FÁBRICAS: TODAS</option>
            </select>
            <select id="estoque-filtro-situacao" onchange="renderEstoque()" class="border-2 p-2 rounded-xl text-xs font-bold bg-white w-40">
                <option value="TODAS">SITUAÇÃO: TODAS</option>
                <option value="ESTOQUE">NO ESTOQUE</option>
                <option value="VENDIDO">VENDIDO</option>
            </select>
        </div>

        <div class="card-premium overflow-hidden">
            <table class="w-full text-left">
                <thead><tr class="bg-slate-50"><th>Móvel</th><th>Fábrica</th><th>Qtd</th><th>Situação</th><th class="text-center">Ação</th></tr></thead>
                <tbody id="tabelaEstoque"></tbody>
            </table>
        </div>
    </main>
