<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercier Design - Gestão Cloud Elite v73.0</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; color: #000; margin: 0; padding: 0; }
        .glass-header { background: #0f172a; border-bottom: 4px solid #3b82f6; }
        .card-premium { background: white; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: 1px solid #e2e8f0; }
        
        .prazo-vencido { background-color: #fecaca !important; border-left: 8px solid #b91c1c !important; animation: pulse-red 2s infinite; }
        .prazo-urgente { background-color: #fee2e2 !important; border-left: 8px solid #ef4444 !important; }
        .prazo-alerta { background-color: #ffedd5 !important; border-left: 8px solid #f97316 !important; }
        .prazo-atencao { background-color: #fef9c3 !important; border-left: 8px solid #eab308 !important; }
        @keyframes pulse-red { 0% { background-color: #fecaca; } 50% { background-color: #f87171; } 100% { background-color: #fecaca; } }

        .status-badge { font-size: 9px; font-weight: 900; padding: 8px; border-radius: 6px; text-transform: uppercase; width: 100%; text-align: center; cursor: pointer; border: none; }
        .btn-sim { background-color: #15803d !important; color: white !important; }
        .btn-nao { background-color: #b91c1c !important; color: white !important; }
        .tab-active { border-bottom: 4px solid #3b82f6; color: #3b82f6; font-weight: 800; }
        
        th { font-size: 10px; font-weight: 900; text-transform: uppercase; color: #64748b; padding: 10px 4px; border-bottom: 2px solid #3b82f6; background: #fff; }
        td { padding: 4px 8px !important; font-weight: 700; color: #0f172a; border-bottom: 1px solid #f1f5f9; }
        input, select, textarea { text-transform: uppercase; outline: none; }
        .editable-cell:hover { background-color: #f8fafc; cursor: pointer; text-decoration: underline; color: #3b82f6; }
        
        /* FONTES UNIFORMES 11PX TRAVADAS */
        .font-tabela-fixa { font-size: 11px !important; font-weight: 700 !important; }
        .col-cliente { max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .col-movel { max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .col-medida { max-width: 95px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .col-cor { max-width: 110px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #btn-sugestao-flutuante { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; background: #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 15px rgba(59,130,246,0.5); cursor: pointer; z-index: 100; }
        #painel-sugestoes { position: fixed; bottom: 90px; right: 24px; width: 320px; height: 450px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 101; display: none; flex-direction: column; border: 1px solid #e2e8f0; }
        #modal-detalhes { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
        
        .select-prazo-tabela { background: #000; color: #fff; font-size: 7.5px !important; font-weight: 900; border-radius: 4px; padding: 1px 2px; cursor: pointer; border: none; }
        .copy-btn-small { cursor: pointer; color: #64748b; font-size: 14px; transition: 0.2s; }
        .copy-btn-small:hover { color: #3b82f6; transform: scale(1.2); }
        .btn-pag-opt { background: #f1f5f9; padding: 6px 12px; border-radius: 8px; font-size: 10px; font-weight: 800; border: 2px solid transparent; cursor: pointer; }
        .btn-pag-opt.active { background: #3b82f6; color: white; border-color: #2563eb; }
    </style>
</head>
<body>

    <header class="glass-header text-white p-5 shadow-xl flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-2xl font-black tracking-tighter uppercase">MERCIER DESIGN</h1>
        <div id="status-db" class="text-[10px] px-4 py-1.5 rounded-full bg-orange-500 font-black text-white uppercase tracking-widest">Conectando...</div>
    </header>

    <nav class="bg-slate-900 text-slate-400 px-8 flex gap-8 shadow-md overflow-x-auto">
        <button onclick="switchTab('pedidos')" id="tab-pedidos" class="py-4 text-xs font-black uppercase tab-active whitespace-nowrap">📋 Pedidos</button>
        <button onclick="switchTab('tarefas')" id="tab-tarefas" class="py-4 text-xs font-black uppercase whitespace-nowrap">📝 Tarefas</button>
        <button onclick="switchTab('assistencia')" id="tab-assistencia" class="py-4 text-xs font-black uppercase whitespace-nowrap">🛠️ Assistências</button>
        <button onclick="switchTab('estoque')" id="tab-estoque" class="py-4 text-xs font-black uppercase whitespace-nowrap">📦 Estoque</button>
        <button onclick="switchTab('catalogo')" id="tab-catalogo" class="py-4 text-xs font-black uppercase whitespace-nowrap">📜 Catálogo</button>
        <button onclick="switchTab('fornecedores')" id="tab-fornecedores" class="py-4 text-xs font-black uppercase whitespace-nowrap">🏭 Fábricas</button>
    </nav>

    <!-- ABA PEDIDOS (PROTEGIDA v67) -->
    <main id="view-pedidos" class="max-w-[1950px] mx-auto p-4 md:p-6">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-6">
            <div class="card-premium p-4 flex flex-col justify-center bg-slate-50 border-2 border-dashed border-slate-300"><input type="file" id="pdfInput" accept="application/pdf" class="text-[10px] cursor-pointer"></div>
            <div class="lg:col-span-3 card-premium p-5 border-l-8 border-blue-600">
                <div class="flex flex-wrap gap-3 mb-4">
                    <input list="listaSugestaoClientes" id="m_cliente" placeholder="NOME DO CLIENTE" class="border-2 p-2 rounded-lg text-xs font-bold flex-1 outline-blue-500">
                    <select id="m_prazo_select" class="border-2 p-2 rounded-lg text-xs font-bold w-32 bg-white"><option value="15">15 Dias</option><option value="20">20 Dias</option><option value="30" selected>30 Dias</option><option value="30-util">30 Úteis</option><option value="40-util">40 Úteis</option></select>
                    <select id="m_fornecedor_select" class="border-2 p-2 rounded-lg text-xs font-bold w-48 bg-white"></select>
                </div>
                <div class="flex flex-wrap gap-2 mb-3 bg-slate-50 p-3 rounded-xl border">
                    <input type="number" id="m_qtd" value="1" class="border-2 p-1.5 rounded-lg text-xs font-bold w-16">
                    <input list="listaSugestaoProdutos" id="m_produto" placeholder="PRODUTO" class="border-2 p-1.5 rounded-lg text-xs font-bold flex-1">
                    <input type="text" id="m_medida" placeholder="MEDIDA" class="border-2 p-1.5 rounded-lg text-xs font-bold w-24">
                    <input type="text" id="m_cor" placeholder="COR/TECIDO" class="border-2 p-1.5 rounded-lg text-xs font-bold w-32">
                    <input type="text" id="m_custo" placeholder="R$ CUSTO" class="border-2 p-1.5 rounded-lg text-xs font-bold w-24" oninput="maskMoney(this)">
                    <input type="text" id="m_pendencia" placeholder="PENDÊNCIA / OBS" class="border-2 p-1.5 rounded-lg text-xs font-bold flex-1">
                    <button onclick="adicionarItemAoCesto()" class="bg-slate-800 text-white px-6 rounded-lg text-[10px] font-black hover:bg-black transition">＋ ITEM</button>
                </div>
                <div id="cesto-itens" class="text-[11px] font-bold text-blue-600 mb-3 italic px-2"></div>
                <button onclick="cadastrarManual()" class="bg-blue-600 text-white font-black rounded-xl text-xs px-8 py-3.5 w-full uppercase shadow-lg hover:bg-blue-700 transition">Finalizar e Sincronizar Pedido</button>
            </div>
        </div>

        <div class="card-premium overflow-hidden">
            <div class="p-4 bg-white border-b flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <input type="text" id="busca" onkeyup="renderPedidos()" placeholder="🔍 BUSCAR..." class="border-2 border-slate-100 px-5 py-2.5 rounded-2xl text-xs w-96 font-bold outline-blue-500">
                    <button onclick="limparBusca()" class="text-slate-400 font-bold px-2">✕</button>
                    <button id="btnFiltroNaoEnviado" onclick="toggleFiltroNaoEnviado()" class="border-2 border-red-500 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase text-red-600 tracking-tighter">Não enviados</button>
                    <button onclick="gerarEmailLote()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-[10px] font-black uppercase shadow">📧 Enviar Selecionados</button>
                </div>
                <span id="contador" class="text-[10px] font-black bg-slate-900 text-white px-4 py-2 rounded-lg uppercase">0 Pedidos</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead><tr><th width="40"><input type="checkbox" id="checkMaster" onclick="marcarTodos(this.checked)"></th><th width="65">Prazo</th><th width="70">ID</th><th>Cliente</th><th width="85">Data</th><th width="45">Qtd</th><th>Móvel</th><th width="70">Medida</th><th width="90">Cor</th><th width="95">Custo</th><th width="120">Status</th><th width="60">Whats?</th><th width="60">Conf?</th><th class="text-center" width="100">Ação</th></tr></thead>
                    <tbody id="tabelaPedidos"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- ABA TAREFAS -->
    <main id="view-tarefas" class="hidden max-w-[1200px] mx-auto p-4 md:p-6">
        <div class="card-premium p-6 border-l-8 border-indigo-600 mb-6">
            <h2 class="text-xs font-black text-slate-400 uppercase mb-4 tracking-wider">Gestão de Atividades</h2>
            <select id="t_tipo" onchange="mostrarCamposTarefa(this.value)" class="border-2 p-3 rounded-xl text-xs font-bold bg-white mb-4 w-full md:w-80 outline-indigo-500"><option value="SIMPLES">Anotação Simples</option><option value="TIRAR PEDIDO">Tirar Pedido</option><option value="MARCAR ENTREGA">Marcar Entrega</option><option value="RETORNO CLIENTE">Retorno p/ Cliente</option></select>
            <div id="container-campos-tarefa" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
            <button onclick="cadastrarTarefa()" class="bg-indigo-600 text-white font-black px-12 py-3.5 rounded-xl text-xs uppercase shadow-lg mt-4 transition hover:bg-indigo-700">Salvar na Lista</button>
        </div>
        <div class="card-premium overflow-hidden">
            <table class="w-full text-left"><thead><tr class="bg-slate-50"><th>Data</th><th>Tarefa</th><th>Tipo</th><th>Status</th><th class="text-center">Remover</th></tr></thead><tbody id="tabelaTarefas"></tbody></table>
        </div>
    </main>

    <!-- ABA ASSISTÊNCIA -->
    <main id="view-assistencia" class="hidden max-w-[1950px] mx-auto p-4 md:p-6">
        <div class="card-premium p-6 border-l-8 border-orange-500 flex gap-4 mb-6">
            <input list="listaSugestaoClientes" id="as_cliente" placeholder="NOME DO CLIENTE" class="border-2 p-2 rounded-lg text-xs font-bold flex-1">
            <input id="as_produto" placeholder="MÓVEL / PEÇA" class="border-2 p-2 rounded-lg text-xs font-bold flex-1">
            <select id="as_fabrica" class="border-2 p-2 rounded-lg text-xs font-bold bg-white w-48"></select>
            <button onclick="cadastrarAssistencia()" class="bg-orange-600 text-white px-8 py-2 rounded-lg font-black text-xs uppercase shadow">Registrar</button>
        </div>
        <div class="card-premium overflow-hidden"><table class="w-full text-left"><thead><tr class="bg-slate-50"><th>Data</th><th>Cliente</th><th>Produto</th><th>Status</th><th class="text-center">Ação</th></tr></thead><tbody id="tabelaAssistencias"></tbody></table></div>
    </main>

    <!-- ABA ESTOQUE -->
    <main id="view-estoque" class="hidden p-6 max-w-[1950px] mx-auto">
        <div class="card-premium p-6 border-l-8 border-blue-600 mb-6 flex gap-3 items-end">
            <input id="e_produto" placeholder="PRODUTO" class="border-2 p-2 rounded-lg text-xs font-bold flex-1">
            <input id="e_qtd" type="number" value="1" class="border-2 p-2 rounded-lg text-xs font-bold w-20">
            <select id="e_situacao" class="border-2 p-2 rounded-lg text-xs font-bold bg-white"><option value="ESTOQUE">ESTOQUE</option><option value="VENDIDO">VENDIDO</option></select>
            <button onclick="cadastrarEstoque()" class="bg-blue-600 text-white p-2.5 rounded-lg font-black text-xs uppercase shadow">Add</button>
        </div>
        <div class="card-premium overflow-hidden"><table class="w-full text-left"><thead><tr class="bg-slate-50"><th>Móvel</th><th>Qtd</th><th>Situação</th><th>Ação</th></tr></thead><tbody id="tabelaEstoque"></tbody></table></div>
    </main>

    <!-- ABA CATALOGO -->
    <main id="view-catalogo" class="hidden p-6 max-w-[1200px] mx-auto">
        <div class="card-premium p-6 border-l-8 border-blue-600 mb-6 flex gap-2"><input id="cat_nome" placeholder="NOME DO MÓVEL" class="border-2 p-2 rounded-lg flex-1 font-bold uppercase"><button onclick="cadastrarCatalogo()" class="bg-blue-600 text-white px-8 py-2 rounded-lg font-black text-xs uppercase">Salvar</button></div>
        <div class="card-premium overflow-hidden"><table class="w-full text-left"><thead><tr class="bg-slate-50"><th>Nome</th><th class="text-center">Ação</th></tr></thead><tbody id="tabelaCatalogo"></tbody></table></div>
    </main>

    <!-- ABA FÁBRICAS -->
    <main id="view-fornecedores" class="hidden max-w-4xl mx-auto p-6">
        <div class="card-premium p-6 border-l-8 border-blue-600 mb-6 flex gap-2"><input id="f_nome" placeholder="FÁBRICA" class="border-2 p-2 rounded-lg flex-1 font-bold"><input id="f_email" placeholder="EMAIL" class="border-2 p-2 rounded-lg flex-1 font-bold lowercase"><button onclick="cadastrarFornecedor()" class="bg-blue-600 text-white px-8 py-2 rounded font-black text-xs uppercase tracking-tighter">Salvar</button></div>
        <div class="card-premium overflow-hidden"><table class="w-full text-left"><thead><tr class="bg-slate-50"><th>Fábrica</th><th>E-mail</th><th class="text-center">Remover</th></tr></thead><tbody id="tabelaFornecedores"></tbody></table></div>
    </main>

    <!-- MODAIS -->
    <div id="modal-detalhes" onclick="if(event.target==this) this.style.display='none'"><div class="card-premium w-full max-w-2xl bg-white overflow-hidden flex flex-col max-h-[90vh]"><div class="bg-indigo-600 p-4 text-white font-black flex justify-between items-center uppercase text-sm"><span>Resumo Detalhado</span><button onclick="document.getElementById('modal-detalhes').style.display='none'">✕</button></div><div id="detalhe-corpo" class="p-8 overflow-y-auto space-y-4"></div></div></div>
    <div id="btn-sugestao-flutuante" onclick="togglePainelSugestoes()">💡</div>
    <div id="painel-sugestoes"><div class="bg-blue-600 p-4 text-white font-black text-[10px] flex justify-between items-center uppercase tracking-widest"><span>💡 Sugestões</span><button onclick="togglePainelSugestoes()">✕</button></div><textarea id="texto-melhorias" class="flex-1 p-4 text-sm font-bold uppercase border-0 outline-none resize-none" oninput="autoSalvarNotas()"></textarea></div>

    <datalist id="listaSugestaoProdutos"></datalist>
    <datalist id="listaSugestaoClientes"></datalist>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA_fQSZJJcz5Wszw54W5EhMN9D5rNnjoCo",
            authDomain: "mercier-design.firebaseapp.com",
            projectId: "mercier-design",
            storageBucket: "mercier-design.firebasestorage.app",
            messagingSenderId: "1060891658513",
            appId: "1:1060891658513:web:2eefd15227203af39064b0",
            databaseURL: "https://mercier-design-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let pedidos=[], fornecedores=[], estoque=[], catalogo=[], tarefas=[], assistencias=[], proximoID=255, notasMelhoria="", cestoItensTemporario=[], filtrandoNaoEnviados=false, cpfValido=true;

        db.ref('dados').on('value', (s) => {
            const d = s.val() || {};
            pedidos=d.pedidos||[]; fornecedores=d.fornecedores||[]; estoque=d.estoque||[]; catalogo=d.catalogo||[]; tarefas=d.tarefas||[]; assistencias=d.assistencias||[]; proximoID=d.proximoID||255; notasMelhoria=d.notasMelhoria||"";
            document.getElementById('status-db').innerText="SINCRONIZADO";
            document.getElementById('status-db').className="text-[10px] px-4 py-1.5 rounded-full bg-green-600 font-black text-white uppercase";
            document.getElementById('texto-melhorias').value=notasMelhoria;
            atualizarSugestoes(); atualizarSelectsFornecedores(); renderAll();
        });

        function renderAll(){ renderPedidos(); renderTarefas(); renderFornecedores(); renderEstoque(); renderCatalogo(); renderAssistencias(); }
        function salvarCloud(){ db.ref('dados').set({pedidos, fornecedores, estoque, catalogo, tarefas, assistencias, proximoID, notasMelhoria}); }

        // --- ÚTEIS ---
        function formatGrammar(s){ if(!s) return ""; return s.toLowerCase().replace(/(^\w{1})|(\s+\w{1})/g, l => l.toUpperCase()); }
        function copyText(v){ navigator.clipboard.writeText(formatGrammar(v)); alert("Copiado!"); }
        function maskMoney(i){ let v=i.value.replace(/\D/g,""); v=(v/100).toFixed(2).replace(".",","); v=v.replace(/(\d)(?=(\d{3})+(?!\d))/g,"$1."); i.value="R$ "+v; if(i.classList.contains('t-v-desc')) calcTotalT(); }
        function parseMoney(v){ return parseFloat((v||"").replace("R$ ","").replace(/\./g,"").replace(",",".")) || 0; }
        function maskCPF(i){ let v=i.value.replace(/\D/g,""); if(v.length>11)v=v.slice(0,11); v=v.replace(/(\d{3})(\d)/,"$1.$2"); v=v.replace(/(\d{3})(\d)/,"$1.$2"); v=v.replace(/(\d{3})(\d{1,2})$/,"$1-$2"); i.value=v; if(v.length===14) verifCPF(i); }
        function verifCPF(i){ const ok = validarCPF(i.value); i.className = ok ? "border-2 p-2 rounded-lg text-xs font-bold input-success" : "border-2 p-2 rounded-lg text-xs font-bold input-error"; cpfValido=ok; }
        function validarCPF(c){ c=c.replace(/[^\d]+/g,''); if(c.length!==11||!!c.match(/(\d)\1{10}/))return false; let a=0; for(let i=0;i<9;i++)a+=parseInt(c.charAt(i))*(10-i); let r=11-(a%11); if(r===10||r===11)r=0; if(r!==parseInt(c.charAt(9)))return false; a=0; for(let i=0;i<10;i++)a+=parseInt(c.charAt(i))*(11-i); r=11-(a%11); return (r>=10?0:r)===parseInt(c.charAt(10)); }
        async function buscarCEP(i){ let c=i.value.replace(/\D/g,""); if(c.length===8){ try{let r=await fetch(`https://viacep.com.br/ws/${c}/json/`); let d=await r.json(); if(!d.erro){document.getElementById('t_end').value=d.logradouro.toUpperCase(); document.getElementById('t_bairro').value=d.bairro.toUpperCase();}}catch(e){}} }

        // --- PEDIDOS (PROTEGIDOS v70) ---
        function renderPedidos() {
            const tb=document.getElementById('tabelaPedidos'); if(!tb) return;
            const b=document.getElementById('busca').value.toLowerCase();
            let l=pedidos.filter(x=>(x.cliente||"").toLowerCase().includes(b)||(x.produto||"").toLowerCase().includes(b)||(x.idDoc||"").toLowerCase().includes(b));
            if(filtrandoNaoEnviados) l=l.filter(x=>x.status==="Não enviado");
            document.getElementById('contador').innerText=l.length+" PEDIDOS";
            tb.innerHTML = l.map(x=>{
                const p=calcP(x.dataPedido, x.prazo); let sCls=x.status==="Não enviado"?"bg-red-600":(x.status.includes("enviado")?"bg-blue-600":"bg-green-700");
                const vLimpo = (x.custo || "R$ 0,00").replace("R$ ", "");
                return `<tr class="${p.classe}"><td><input type="checkbox" class="ped-check" value="${x.uid}"></td><td><div class="flex flex-col gap-1 items-center"><span class="font-black text-[9px]">${p.dias}D</span><select onchange="updPed(${x.uid},'prazo',this.value)" class="select-prazo-tabela"><option value="15" ${x.prazo=='15'?'selected':''}>15C</option><option value="20" ${x.prazo=='20'?'selected':''}>20C</option><option value="30" ${x.prazo=='30'?'selected':''}>30C</option><option value="30-util" ${x.prazo=='30-util'?'selected':''}>30U</option><option value="40-util" ${x.prazo=='40-util'?'selected':''}>40U</option></select></div></td><td class="text-xs font-bold text-slate-400 font-tabela-fixa">${x.idDoc}</td><td onclick="editField(${x.uid},'cliente')" class="editable-cell uppercase col-cliente font-tabela-fixa">${x.cliente}</td><td class="font-tabela-fixa">${x.dataPedido}</td><td class="text-center font-black font-tabela-fixa text-xs">${x.qtd}</td><td class="uppercase font-tabela-fixa col-movel">${x.produto}</td><td class="font-tabela-fixa col-medida uppercase">${x.medida||'-'}</td><td class="uppercase font-tabela-fixa col-cor uppercase">${x.cor||'-'}</td><td onclick="editField(${x.uid},'custo')" class="editable-cell whitespace-nowrap font-tabela-fixa"><span class="text-[8px] opacity-50">R$</span> ${vLimpo}</td><td><button onclick="cycleStatus(${x.uid})" class="status-badge ${sCls} text-white font-black">${x.status}</button></td><td><button onclick="togPed(${x.uid},'whatsEnviado')" class="status-badge ${x.whatsEnviado?'btn-sim':'btn-nao'} font-black">${x.whatsEnviado?'SIM':'NÃO'}</button></td><td><button onclick="togPed(${x.uid},'confirmado')" class="status-badge ${x.confirmado?'btn-sim':'btn-nao'} font-black">${x.confirmado?'SIM':'NÃO'}</button></td><td><div class="flex gap-1 justify-center"><button onclick="copyText('${x.qtd}x ${x.produto} ${x.cor} (${x.idDoc})')">📋</button><button onclick="dupPed(${x.uid})">➕</button><button onclick="gerarAssistenciaRapida(${x.uid})">🛠️</button><button onclick="excluirPedido(${x.uid})" class="text-red-500 font-black">✖</button></div></td></tr>`;
            }).join('');
        }

        // --- TAREFAS INTELIGENTES ---
        function mostrarCamposTarefa(tipo) {
            const container = document.getElementById('container-campos-tarefa'); container.innerHTML = "";
            if(tipo === 'TIRAR PEDIDO') {
                container.innerHTML = `<input id="t_nome" placeholder="NOME CLIENTE" class="border-2 p-2 rounded-lg text-xs font-bold"><input id="t_cpf" placeholder="CPF" class="border-2 p-2 rounded-lg text-xs font-bold" oninput="maskCPF(this)"><input id="t_cep" placeholder="CEP" class="border-2 p-2 rounded-lg text-xs font-bold" oninput="buscarCEP(this)"><input id="t_end" placeholder="RUA" class="border-2 p-2 rounded-lg text-xs font-bold col-span-2"><input id="t_bairro" placeholder="BAIRRO" class="border-2 p-2 rounded-lg text-xs font-bold"><input id="t_num" placeholder="NÚMERO" class="border-2 p-2 rounded-lg text-xs font-bold"><input id="t_torre" placeholder="TORRE/APTO" class="border-2 p-2 rounded-lg text-xs font-bold"><input id="t_contato" placeholder="CONTATO" class="border-2 p-2 rounded-lg text-xs font-bold"><div class="col-span-3 border-t mt-2 pt-2"><div id="list-p-t"></div><button onclick="addPT()" class="text-[9px] font-bold text-blue-600 mt-1 uppercase">+ Add Produto</button><div id="total-p-t" class="text-xs font-black mt-1 text-indigo-600 uppercase">Total do Pedido: R$ 0,00</div></div><div class="col-span-3 border-t mt-2 pt-2"><div id="list-pg-t"></div><button onclick="addPgT()" class="text-[9px] font-bold text-blue-600 mt-1 uppercase">+ Add Pagamento</button></div><textarea id="t_obs" placeholder="OBS..." class="col-span-3 border-2 p-2 rounded text-xs font-bold h-16 mt-1 uppercase"></textarea>`;
                addPT(); addPgT();
            } else if(tipo === 'SIMPLES') container.innerHTML = `<div class="col-span-3"><input id="t_raw" placeholder="DESCRIÇÃO DA TAREFA..." class="border-2 p-3 rounded-xl text-xs font-bold w-full"></div>`;
            else container.innerHTML = `<input id="t_cli" placeholder="CLIENTE..." class="border-2 p-2 rounded text-xs font-bold col-span-3">`;
        }
        function addPT(){ let d=document.getElementById('list-p-t'); let r=document.createElement('div'); r.className="flex gap-2 items-end mt-1"; r.innerHTML=`<input class="t-prod border-2 p-2 rounded text-xs font-bold flex-1" placeholder="MÓVEL"><input class="t-v-orig border-2 p-2 rounded text-xs font-bold w-24" oninput="maskMoney(this)" placeholder="ORIGINAL"><input class="t-v-desc border-2 p-2 rounded text-xs font-bold w-24" oninput="maskMoney(this)" placeholder="DESC."><button onclick="this.parentElement.remove(); calcTotalT();" class="p-2 text-red-500 font-black">✖</button>`; d.appendChild(r); }
        function addPgT(){
            let d=document.getElementById('list-pg-t'); let tV=0; document.querySelectorAll('.t-v-desc').forEach(i=> tV += parseMoney(i.value)); let tP=0; document.querySelectorAll('.t-p-val').forEach(i=> tP += parseMoney(i.value)); let saldo = tV - tP;
            let r=document.createElement('div'); r.className="bg-slate-50 p-2 rounded border mt-1 flex flex-col gap-1";
            r.innerHTML=`<div class="flex gap-1"><button onclick="setPag(this,'PIX')" class="btn-pag-opt active">PIX</button><button onclick="setPag(this,'CRÉDITO')" class="btn-pag-opt">CRÉDITO</button><button onclick="setPag(this,'DÉBITO')" class="btn-pag-opt">DÉBITO</button><button onclick="setPag(this,'CHEQUE')" class="btn-pag-opt">CHEQUE</button><input type="hidden" class="t-p-forma" value="PIX"></div><div class="flex gap-1"><input placeholder="VALOR" class="t-p-val border-2 p-1.5 rounded text-xs font-bold flex-1" oninput="maskMoney(this)" value="${saldo>0?'R$ '+saldo.toLocaleString('pt-BR',{minimumFractionDigits:2}):''}"> <input placeholder="DATA" class="t-p-data border-2 p-1.5 rounded text-xs font-bold w-32"><button onclick="this.parentElement.parentElement.remove()" class="text-red-500 font-black">✖</button></div>`;
            d.appendChild(r);
        }
        function setPag(b,v){ b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); b.parentElement.querySelector('input').value=v; }
        function calcTotalT(){ let t=0; document.querySelectorAll('.t-v-desc').forEach(i=> t += parseMoney(i.value)); if(document.getElementById('total-p-t')) document.getElementById('total-p-t').innerText="Total do Pedido: R$ "+t.toLocaleString('pt-BR',{minimumFractionDigits:2}); }

        function cadastrarTarefa(){
            const t=document.getElementById('t_tipo').value; if(t==='TIRAR PEDIDO' && !cpfValido) return alert("CPF INVÁLIDO!");
            let obj={ uid:Date.now(), data:new Date().toLocaleDateString('pt-BR'), tipo:t, status:"Não Iniciado" };
            if(t==='TIRAR PEDIDO'){
                obj.detalhes={ nome:document.getElementById('t_nome').value, cpf:document.getElementById('t_cpf').value, cep:document.getElementById('t_cep').value, end:document.getElementById('t_end').value, bairro:document.getElementById('t_bairro').value, num:document.getElementById('t_num').value, torre:document.getElementById('t_torre').value, contato:document.getElementById('t_contato').value, obs:document.getElementById('t_obs').value, prods:[], pags:[] };
                document.querySelectorAll('#list-p-t > div').forEach(r=>{ obj.detalhes.prods.push({n:r.querySelector('.t-prod').value, o:r.querySelector('.t-v-orig').value, d:r.querySelector('.t-v-desc').value}); });
                document.querySelectorAll('#list-pg-t > div').forEach(r=>{ obj.detalhes.pags.push({f:r.querySelector('.t-p-forma').value, v:r.querySelector('.t-p-val').value, dt:r.querySelector('.t-p-data').value}); });
                obj.descricao="PEDIDO: "+obj.detalhes.nome;
            } else if(t==='SIMPLES') obj.descricao=document.getElementById('t_raw').value;
            else obj.descricao=t+": "+(document.getElementById('t_cli')?.value||"");
            if(!obj.descricao) return; tarefas.unshift(obj); salvarCloud(); mostrarCamposTarefa(t);
        }

        function verDetalhesTarefa(uid){
            const t=tarefas.find(x=>x.uid==uid); if(!t) return;
            document.getElementById('modal-detalhes').style.display='flex';
            const c=document.getElementById('detalhe-corpo');
            if(!t.detalhes){ c.innerHTML=`<div class="bg-slate-50 p-6 rounded flex justify-between items-center uppercase font-black"><span>${t.descricao}</span><i class="copy-btn-small" onclick="copyText('${t.descricao}')">📋</i></div>`; return; }
            let h=`<div class="grid grid-cols-1 gap-2">${f_i('CLIENTE', t.detalhes.nome)} ${f_i('CPF', t.detalhes.cpf)} ${f_i('CEP', t.detalhes.cep)} ${f_i('RUA', t.detalhes.end)} ${f_i('BAIRRO', t.detalhes.bairro)} ${f_i('NÚMERO', t.detalhes.num)} ${f_i('TORRE/APTO', t.detalhes.torre || '-')} ${f_i('CONTATO', t.detalhes.contato)}</div><div class="border-t pt-2">`;
            t.detalhes.prods.forEach(p=>h+=`<div class="bg-slate-50 p-2 rounded mb-1 flex justify-between uppercase text-xs font-bold"><span>${p.n}</span><span>${p.d} <i class="copy-btn-small" onclick="copyText('${p.n} (Orig: ${p.o} / Desc: ${p.d})')">📋</i></span></div>`);
            h+=`</div><div class="border-t pt-2">`;
            t.detalhes.pags.forEach(p=>h+=`<div class="bg-slate-50 p-2 rounded mb-1 flex justify-between uppercase text-xs font-bold"><span>${p.f}</span><span>${p.v} em ${p.dt} <i class="copy-btn-small" onclick="copyText('${p.f} - ${p.v} em ${p.dt}')">📋</i></span></div>`);
            h+=`</div><div class="border-t pt-2 font-bold uppercase text-xs">${t.detalhes.obs || '-'}</div>`;
            c.innerHTML=h;
        }
        function f_i(l,v){ return `<div class="bg-slate-50 p-2 rounded border flex justify-between items-center"><div class="flex flex-col"><label class="text-[8px] font-black text-slate-400 uppercase">${l}</label><span class="text-xs font-bold uppercase">${v}</span></div><i class="copy-btn-small" onclick="copyText('${v}')">📋</i></div>`; }

        // --- RENDERIZADORES DAS OUTRAS ABAS ---
        function renderAssistencias() {
            const tb=document.getElementById('tabelaAssistencias'); if(!tb) return;
            tb.innerHTML = assistencias.map(a=>`<tr><td>${a.data}</td><td class="uppercase font-black text-xs">${a.cliente}</td><td class="text-xs">${a.produto}</td><td><button onclick="cycleA(${a.uid})" class="status-badge bg-orange-600 text-white font-black">${a.status || 'ABERTA'}</button></td><td class="text-center flex gap-2 justify-center py-4"><button onclick="mailA(${a.uid})">✉️</button><button onclick="assistencias=assistencias.filter(x=>x.uid!=${a.uid});salvarCloud();">✖</button></td></tr>`).join('');
        }
        function renderEstoque() {
            const tb=document.getElementById('tabelaEstoque'); if(!tb) return;
            tb.innerHTML = estoque.map(x=>`<tr><td class="font-black text-xs p-4 uppercase">${x.produto}</td><td class="p-4">${x.qtd}</td><td class="p-4"><span class="px-2 py-1 rounded text-[9px] font-black ${x.situacao==='VENDIDO'?'bg-red-100 text-red-700':'bg-green-100 text-green-700'}">${x.situacao}</span></td><td class="p-4 text-center"><button onclick="estoque=estoque.filter(y=>y.uid!=${x.uid});salvarCloud();">✖</button></td></tr>`).join('');
        }
        function renderCatalogo() {
            const tb=document.getElementById('tabelaCatalogo'); if(!tb) return;
            tb.innerHTML = catalogo.map((c,i)=>`<tr><td class="p-4 font-black uppercase text-xs">${c.nome}</td><td class="text-center p-4"><button onclick="catalogo.splice(${i},1);salvarCloud();">✖</button></td></tr>`).join('');
        }
        function renderFornecedores() {
            const tb=document.getElementById('tabelaFornecedores'); if(!tb) return;
            tb.innerHTML = fornecedores.map((f,i)=>`<tr><td class="p-4 font-black uppercase text-xs">${f.nome}</td><td class="p-4 text-xs lowercase">${f.email}</td><td class="text-center p-4"><button onclick="fornecedores.splice(${i},1);salvarCloud();">✖</button></td></tr>`).join('');
        }
        function renderTarefas() {
            const tb=document.getElementById('tabelaTarefas'); if(!tb) return;
            const f=document.getElementById('filtro-tarefa').value;
            let l = f === 'TODAS' ? tarefas : tarefas.filter(x => x.status === f);
            tb.innerHTML = l.map(x=>`<tr onclick="verDetalhesTarefa(${x.uid})" class="hover:bg-slate-50 cursor-pointer"><td>${x.data}</td><td class="font-black text-xs uppercase">${x.descricao}</td><td class="text-[9px] opacity-40 uppercase font-black">${x.tipo}</td><td><button onclick="event.stopPropagation(); cycleTarefaStatus(${x.uid})" class="status-badge ${x.status==='Feito'?'bg-green-600':(x.status==='Em Andamento'?'bg-orange-500':'bg-slate-400')} text-white">${x.status}</button></td><td class="text-center"><button onclick="event.stopPropagation(); tarefas=tarefas.filter(y=>y.uid!=${x.uid});salvarCloud();">✖</button></td></tr>`).join('');
        }

        // --- SISTEMA GERAL ---
        function cycleStatus(u){ const x=pedidos.find(y=>y.uid==u); const s=["Não enviado","Pedido enviado ao fornecedor","Pedido chegou na loja"]; x.status=s[(s.indexOf(x.status)+1)%s.length]; salvarCloud(); }
        function cycleTarefaStatus(u){ const x=tarefas.find(y=>y.uid==u); const s=["Não Iniciado","Em Andamento","Feito"]; x.status=s[(s.indexOf(x.status)+1)%s.length]; salvarCloud(); }
        function cycleA(u){ const x=assistencias.find(y=>y.uid==u); const s=["ABERTA","EM ANALISE","CONCLUIDA"]; x.status=s[(s.indexOf(x.status)+1)%s.length]; salvarCloud(); }
        function togglePainelSugestoes(){ const p=document.getElementById('painel-sugestoes'); p.style.display=p.style.display==='flex'?'none':'flex'; }
        function autoSalvarNotas(){ notasMelhoria=document.getElementById('texto-melhorias').value; db.ref('dados/notasMelhoria').set(notasMelhoria); }
        function toggleFiltroNaoEnviado(){ filtrandoNaoEnviados=!filtrandoNaoEnviados; document.getElementById('btnFiltroNaoEnviado').classList.toggle('bg-red-600'); renderPedidos(); }
        function limparBusca(){ document.getElementById('busca').value=""; renderPedidos(); }
        function marcarTodos(v){ document.querySelectorAll('.ped-check').forEach(c=>c.checked=v); }
        function updPed(u,c,v){ pedidos.find(x=>x.uid==u)[c]=v; salvarCloud(); }
        function togPed(u,c){ const x=pedidos.find(y=>y.uid==u); if(x) x[c]=!x[c]; salvarCloud(); }
        function editField(u,f){ const x=pedidos.find(y=>y.uid==u); let n=prompt(`Editar:`,x[f]||""); if(n!==null){ if(f==='custo'){ let v=n.replace(/\D/g,""); x[f]=v? "R$ "+(v/100).toFixed(2).replace(".",",").replace(/(\d)(?=(\d{3})+(?!\d))/g,"$1.") : "R$ 0,00"; } else {x[f]=n.toUpperCase();} salvarCloud(); } }
        function excluirPedido(u){ if(confirm("Excluir?")){ pedidos=pedidos.filter(x=>x.uid!=u); salvarCloud(); } }
        function dupPed(u){ const x=pedidos.find(y=>y.uid==u); const idDoc="ID#"+proximoID.toString().padStart(4,'0'); proximoID++; pedidos.unshift({...x, uid:Date.now(), idDoc}); salvarCloud(); }
        function atualizarSelectsFornecedores(){ const h = fornecedores.map(f => `<option value="${f.nome}">${f.nome}</option>`).join(''); document.getElementById('m_fornecedor_select').innerHTML = h || "<option>...</option>"; }
        function atualizarSugestoes(){ const n=[...new Set(pedidos.map(p=>p.cliente))].sort(); if(document.getElementById('listaSugestaoClientes')) document.getElementById('listaSugestaoClientes').innerHTML=n.map(x=>`<option value="${x}">`).join(''); }
        function gerarAssistenciaRapida(u){ const x=pedidos.find(y=>y.uid==u); document.getElementById('as_cliente').value=x.cliente; document.getElementById('as_produto').value=`${x.produto} - ${x.cor}`; switchTab('assistencia'); }
        function cadastrarEstoque() { estoque.unshift({ uid: Date.now(), produto: document.getElementById('e_produto').value.toUpperCase(), qtd: document.getElementById('e_qtd').value, situacao: document.getElementById('e_situacao').value }); salvarCloud(); }
        function cadastrarCatalogo() { catalogo.push({ nome: document.getElementById('cat_nome').value.toUpperCase() }); salvarCloud(); }
        function cadastrarFornecedor() { fornecedores.push({ nome: document.getElementById('f_nome').value.toUpperCase(), email: document.getElementById('f_email').value.toLowerCase() }); salvarCloud(); }
        function cadastrarAssistencia() { assistencias.unshift({ uid: Date.now(), data: new Date().toLocaleDateString('pt-BR'), cliente: document.getElementById('as_cliente').value.toUpperCase(), produto: document.getElementById('as_produto').value.toUpperCase(), status: 'ABERTA' }); salvarCloud(); }
        function gerarEmailLote() { const sels = Array.from(document.querySelectorAll('.ped-check:checked')); if(sels.length === 0) return alert("Selecione os pedidos!"); const items = pedidos.filter(p => sels.map(c=>parseFloat(c.value)).includes(p.uid)); const fab = items[0].fornecedor; const fObj = fornecedores.find(f => f.nome === fab); if(!fObj || !fObj.email) return alert("Fábrica sem email!"); const h = new Date().getHours(); const saud = h < 12 ? "Bom dia" : (h < 18 ? "Boa tarde" : "Boa noite"); let list = items.map(i => `Qtde: ${i.qtd.toString().padStart(2,'0')} - ${i.produto} ${i.medida} ${i.cor} (${i.idDoc})`).join("\n"); const corpo = `${saud}!\n\nSegue abaixo o pedido para ${fab}:\n\n${list}\n\nFico no aguardo do documento de confirmação com a relação dos itens acima para conferência.\n\nAtenciosamente,\nLucas Mercier.`; window.open(`mailto:${fObj.email}?subject=Pedido Mercier Design&body=${encodeURIComponent(corpo)}`); }
        function mailA(u){ const a=assistencias.find(x=>x.uid==u); window.open(`mailto:?subject=Assistencia&body=Cliente: ${a.cliente}`); }
        function calcP(d, pr){ if(!d)return{dias:0,classe:""}; try { const pA=d.split("/"); const dt=new Date(pA[2], pA[1]-1, pA[0]); let dF=new Date(dt); if(pr.includes("util")){ let c=0; while(c<parseInt(pr)){dF.setDate(dF.getDate()+1); if(dF.getDay()!==0&&dF.getDay()!==6)c++;} } else {dF.setDate(dF.getDate()+parseInt(pr||30));} const df=Math.ceil((dF-new Date())/86400000); let c=df<0?"prazo-vencido":(df<=5?"prazo-urgente":(df<=10?"prazo-alerta":(df<=20?"prazo-atencao":""))); return {dias:df,classe:c}; } catch(e){return {dias:0,classe:""}} }

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
    </script>
</body>
</html>
