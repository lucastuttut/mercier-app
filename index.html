<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercier Design - Gestão Cloud Elite v56.0</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; color: #000; margin: 0; padding: 0; }
        .glass-header { background: #0f172a; border-bottom: 4px solid #3b82f6; }
        .card-premium { background: white; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: 1px solid #e2e8f0; }
        
        .prazo-vencido { background-color: #fecaca !important; border-left: 8px solid #b91c1c !important; animation: pulse-red 2s infinite; }
        .prazo-urgente { background-color: #fee2e2 !important; border-left: 8px solid #ef4444 !important; }
        .prazo-alerta { background-color: #ffedd5 !important; border-left: 8px solid #f97316 !important; }
        .prazo-atencao { background-color: #fef9c3 !important; border-left: 8px solid #eab308 !important; }
        @keyframes pulse-red { 0% { background-color: #fecaca; } 50% { background-color: #f87171; } 100% { background-color: #fecaca; } }

        .status-badge { font-size: 9px; font-weight: 900; padding: 8px; border-radius: 6px; text-transform: uppercase; width: 100%; text-align: center; cursor: pointer; border: none; }
        .btn-sim { background-color: #15803d !important; color: white !important; }
        .btn-nao { background-color: #b91c1c !important; color: white !important; }
        .tab-active { border-bottom: 4px solid #3b82f6; color: #3b82f6; font-weight: 800; }
        
        th { font-size: 10px; font-weight: 900; text-transform: uppercase; color: #64748b; padding: 12px; border-bottom: 2px solid #3b82f6; background: #fff; }
        td { padding: 8px 12px !important; font-weight: 700; color: #0f172a; border-bottom: 1px solid #f1f5f9; }
        input, select, textarea { text-transform: uppercase; outline: none; }
        .editable-cell:hover { background-color: #f8fafc; cursor: pointer; text-decoration: underline; color: #3b82f6; }
        
        #btn-sugestao-flutuante { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; background: #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 15px rgba(59,130,246,0.5); cursor: pointer; z-index: 100; transition: transform 0.2s; }
        #painel-sugestoes { position: fixed; bottom: 90px; right: 24px; width: 320px; height: 450px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 101; display: none; flex-direction: column; border: 1px solid #e2e8f0; }

        .btn-pag-opt { background: #f1f5f9; padding: 6px 12px; border-radius: 8px; font-size: 10px; font-weight: 800; border: 2px solid transparent; transition: 0.2s; }
        .btn-pag-opt.active { background: #3b82f6; color: white; border-color: #2563eb; }
        
        .input-error { border-color: #ef4444 !important; background-color: #fef2f2 !important; }
        .input-success { border-color: #22c55e !important; background-color: #f0fdf4 !important; }

        /* Modal Detalhes */
        #modal-detalhes { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body>

    <header class="glass-header text-white p-5 shadow-xl flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-2xl font-black tracking-tighter uppercase">MERCIER DESIGN</h1>
        <div id="status-db" class="text-[10px] px-4 py-1.5 rounded-full bg-orange-500 font-black text-white uppercase tracking-widest">Conectando...</div>
    </header>

    <nav class="bg-slate-900 text-slate-400 px-8 flex gap-8 shadow-md overflow-x-auto">
        <button onclick="switchTab('pedidos')" id="tab-pedidos" class="py-4 text-xs font-black uppercase tab-active whitespace-nowrap">📋 Pedidos</button>
        <button onclick="switchTab('tarefas')" id="tab-tarefas" class="py-4 text-xs font-black uppercase whitespace-nowrap">📝 Tarefas</button>
        <button onclick="switchTab('assistencia')" id="tab-assistencia" class="py-4 text-xs font-black uppercase whitespace-nowrap">🛠️ Assistências</button>
        <button onclick="switchTab('estoque')" id="tab-estoque" class="py-4 text-xs font-black uppercase whitespace-nowrap">📦 Estoque</button>
        <button onclick="switchTab('catalogo')" id="tab-catalogo" class="py-4 text-xs font-black uppercase whitespace-nowrap">📜 Catálogo</button>
        <button onclick="switchTab('fornecedores')" id="tab-fornecedores" class="py-4 text-xs font-black uppercase whitespace-nowrap">🏭 Fábricas</button>
    </nav>

    <!-- ABA PEDIDOS -->
    <main id="view-pedidos" class="max-w-[1950px] mx-auto p-4 md:p-6">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-6">
            <div class="card-premium p-4 flex flex-col justify-center bg-slate-50 border-2 border-dashed border-slate-300">
                <input type="file" id="pdfInput" accept="application/pdf" class="text-[10px] cursor-pointer">
            </div>
            <div class="lg:col-span-3 card-premium p-5 border-l-8 border-blue-600">
                <div class="flex flex-wrap gap-3 mb-4">
                    <input list="listaSugestaoClientes" id="m_cliente" placeholder="NOME DO CLIENTE" class="border-2 p-2 rounded-lg text-xs font-bold flex-1 outline-blue-500">
                    <select id="m_prazo_select" class="border-2 p-2 rounded-lg text-xs font-bold w-32 bg-white">
                        <option value="15">15 Dias</option><option value="20">20 Dias</option><option value="30" selected>30 Dias</option><option value="30-util">30 Úteis</option><option value="40-util">40 Úteis</option>
                    </select>
                    <select id="m_fornecedor_select" class="border-2 p-2 rounded-lg text-xs font-bold w-48 bg-white"></select>
                </div>
                <div class="flex flex-wrap gap-2 mb-3 bg-slate-50 p-3 rounded-xl border">
                    <input type="number" id="m_qtd" value="1" class="border-2 p-1.5 rounded-lg text-xs font-bold w-16">
                    <input list="listaSugestaoProdutos" id="m_produto" placeholder="PRODUTO" class="border-2 p-1.5 rounded-lg text-xs font-bold flex-1">
                    <input type="text" id="m_medida" placeholder="MEDIDA" class="border-2 p-1.5 rounded-lg text-xs font-bold w-24">
                    <input type="text" id="m_cor" placeholder="COR/TECIDO" class="border-2 p-1.5 rounded-lg text-xs font-bold w-32">
                    <input type="text" id="m_custo" placeholder="R$ CUSTO" class="border-2 p-1.5 rounded-lg text-xs font-bold w-24" oninput="maskMoney(this)">
                    <input type="text" id="m_pendencia" placeholder="O QUE FALTA? / OBS" class="border-2 p-1.5 rounded-lg text-xs font-bold flex-1">
                    <button onclick="adicionarItemAoCesto()" class="bg-slate-800 text-white px-6 rounded-lg text-[10px] font-black hover:bg-black transition">＋ ITEM</button>
                </div>
                <div id="cesto-itens" class="text-[11px] font-bold text-blue-600 mb-3 italic px-2"></div>
                <button onclick="cadastrarManual()" class="bg-blue-600 text-white font-black rounded-xl text-xs px-8 py-3.5 w-full uppercase shadow-lg hover:bg-blue-700 transition">Finalizar e Sincronizar Pedido</button>
            </div>
        </div>

        <div class="card-premium overflow-hidden">
            <div class="p-4 bg-white border-b flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <div class="relative flex-1 md:flex-none">
                        <input type="text" id="busca" onkeyup="renderPedidos()" placeholder="🔍 BUSCAR..." class="border-2 border-slate-100 px-5 py-2.5 rounded-2xl text-xs w-full md:w-96 font-bold outline-blue-500">
                        <button onclick="limparBusca()" class="absolute right-4 top-2.5 text-slate-400 font-bold">✕</button>
                    </div>
                    <button id="btnFiltroNaoEnviado" onclick="toggleFiltroNaoEnviado()" class="border-2 border-red-500 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase text-red-600">Não enviados</button>
                    <button onclick="gerarEmailLote()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-[10px] font-black uppercase shadow hover:bg-emerald-700">📧 Enviar Selecionados</button>
                </div>
                <span id="contador" class="text-[10px] font-black bg-slate-900 text-white px-4 py-2 rounded-lg uppercase">0 Pedidos</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr>
                            <th width="40"><input type="checkbox" onclick="marcarTodos(this.checked)"></th>
                            <th>Prazo</th><th>ID</th><th>Cliente</th><th>Data</th><th>Qtd</th><th>Móvel</th><th>Medida</th><th>Cor</th><th>Custo</th><th>Obs</th><th>Fábrica</th><th>Status</th><th>Whats?</th><th>Conf?</th><th class="text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaPedidos"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- ABA TAREFAS -->
    <main id="view-tarefas" class="hidden max-w-[1200px] mx-auto p-4 md:p-6">
        <div class="card-premium p-6 border-l-8 border-indigo-600 mb-6">
            <h2 class="text-xs font-black text-slate-400 uppercase mb-4 tracking-wider">Gestão de Atividades</h2>
            <div class="flex flex-col md:flex-row gap-4 mb-4">
                <div class="flex flex-col w-full md:w-72">
                    <label class="text-[9px] font-black ml-1 mb-1 uppercase text-indigo-600">O que você vai fazer?</label>
                    <select id="t_tipo" onchange="mostrarCamposTarefa(this.value)" class="border-2 p-3 rounded-xl text-xs font-bold bg-white">
                        <option value="SIMPLES">Anotação Simples</option>
                        <option value="TIRAR PEDIDO">Tirar Pedido</option>
                        <option value="MARCAR ENTREGA">Marcar Entrega</option>
                        <option value="RETORNO CLIENTE">Dar Retorno para Cliente</option>
                    </select>
                </div>
            </div>
            <div id="container-campos-tarefa" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
            <div class="mt-6 flex gap-3"><button onclick="cadastrarTarefa()" class="bg-indigo-600 text-white font-black px-12 py-3.5 rounded-xl text-xs uppercase shadow-lg">Salvar na Lista</button></div>
        </div>

        <div class="card-premium overflow-hidden">
            <div class="p-4 bg-white border-b flex flex-wrap justify-between items-center gap-4">
                <select id="filtro-tarefa" onchange="renderTarefas()" class="border-2 p-2 rounded-lg text-[10px] font-black uppercase bg-white"><option value="TODAS">Ver Todas</option><option value="Não Iniciado">Não Iniciado</option><option value="Em Andamento">Em Andamento</option><option value="Feito">Feito</option></select>
                <button onclick="gerarFechamentoDiario()" class="bg-slate-900 text-white px-4 py-2 rounded-lg text-[10px] font-black uppercase shadow">📊 Relatório do Dia</button>
            </div>
            <table class="w-full text-left">
                <thead><tr class="bg-slate-50"><th>Data</th><th>Tarefa</th><th>Tipo</th><th>Status</th><th class="text-center">Ações</th></tr></thead>
                <tbody id="tabelaTarefas"></tbody>
            </table>
        </div>
    </main>

    <!-- ABA ESTOQUE -->
    <main id="view-estoque" class="hidden max-w-[1950px] mx-auto p-6">
        <div class="card-premium p-6 mb-8 border-l-8 border-blue-600 flex flex-wrap gap-3 items-end">
            <div class="flex flex-col flex-1"><label class="text-[9px] font-black ml-1">PRODUTO</label><input list="listaSugestaoProdutos" id="e_produto" class="border-2 p-2 rounded-lg text-xs font-bold"></div>
            <div class="flex flex-col w-32"><label class="text-[9px] font-black ml-1">COR</label><input type="text" id="e_cor" class="border-2 p-2 rounded-lg text-xs font-bold"></div>
            <div class="flex flex-col w-32"><label class="text-[9px] font-black ml-1">MEDIDA</label><input type="text" id="e_medida" class="border-2 p-2 rounded-lg text-xs font-bold"></div>
            <div class="flex flex-col w-40"><label class="text-[9px] font-black ml-1">FÁBRICA</label><select id="e_fornecedor_select" class="border-2 p-2 rounded-lg text-xs font-bold bg-white"></select></div>
            <div class="flex flex-col w-40"><label class="text-[9px] font-black ml-1">SITUAÇÃO</label><select id="e_situacao" class="border-2 p-2 rounded-lg text-xs font-bold bg-white"><option value="ESTOQUE">ESTOQUE</option><option value="VENDIDO">VENDIDO</option><option value="DEVOLUÇÃO">DEVOLUÇÃO</option><option value="ASSISTENCIA">ASSISTENCIA</option></select></div>
            <div class="flex flex-col w-20"><label class="text-[9px] font-black ml-1">QTD</label><input type="number" id="e_qtd" value="1" class="border-2 p-2 rounded-lg text-xs font-bold"></div>
            <button onclick="cadastrarEstoque()" class="bg-blue-600 text-white font-black px-6 py-2.5 rounded-lg text-xs uppercase">Add</button>
        </div>
        <div class="card-premium overflow-hidden"><table class="w-full text-left"><thead><tr class="bg-slate-50"><th>Móvel</th><th>Cor</th><th>Medida</th><th>Fábrica</th><th>Qtd</th><th>Situação</th><th class="text-center">Ações</th></tr></thead><tbody id="tabelaEstoque"></tbody></table></div>
    </main>

    <!-- ABA CATALOGO -->
    <main id="view-catalogo" class="hidden max-w-5xl mx-auto p-6">
        <div class="card-premium p-6 mb-6 border-l-8 border-blue-600 flex flex-wrap gap-2 items-end">
            <div class="flex flex-col flex-1"><label class="text-[9px] font-black ml-1">NOME DO MÓVEL</label><input type="text" id="cat_nome" class="border-2 p-2 rounded-lg font-bold uppercase"></div>
            <div class="flex flex-col w-32"><label class="text-[9px] font-black ml-1">MEDIDA</label><input type="text" id="cat_medida" class="border-2 p-2 rounded-lg font-bold"></div>
            <div class="flex flex-col w-40"><label class="text-[9px] font-black ml-1">COR/TECIDO</label><input type="text" id="cat_cor" class="border-2 p-2 rounded-lg font-bold"></div>
            <div class="flex flex-col w-40"><label class="text-[9px] font-black ml-1">SITUAÇÃO PADRÃO</label><select id="cat_situacao" class="border-2 p-2 rounded-lg font-bold bg-white"><option value="ESTOQUE">ESTOQUE</option><option value="VENDIDO">VENDIDO</option><option value="DEVOLUÇÃO">DEVOLUÇÃO</option><option value="ASSISTENCIA">ASSISTENCIA</option></select></div>
            <button onclick="cadastrarCatalogo()" class="bg-blue-600 text-white px-6 py-2.5 rounded font-black text-xs uppercase">Salvar</button>
        </div>
        <div class="card-premium overflow-hidden"><table class="w-full text-left"><thead><tr class="bg-slate-50"><th>Móvel</th><th>Medida</th><th>Cor</th><th>Situação</th><th class="text-center">Ações</th></tr></thead><tbody id="tabelaCatalogo"></tbody></table></div>
    </main>

    <!-- OUTRAS ABAS SIMPLIFICADAS -->
    <main id="view-assistencia" class="hidden p-6"></main>
    <main id="view-fornecedores" class="hidden p-6"></main>

    <!-- MODAL DETALHES TAREFA -->
    <div id="modal-detalhes" onclick="if(event.target==this) this.style.display='none'">
        <div class="card-premium w-full max-w-2xl bg-white overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-indigo-600 p-4 text-white font-black flex justify-between items-center">
                <span id="detalhe-titulo">DETALHES DA TAREFA</span>
                <button onclick="document.getElementById('modal-detalhes').style.display='none'">✕</button>
            </div>
            <div id="detalhe-corpo" class="p-6 overflow-y-auto space-y-4"></div>
            <div class="p-4 border-t flex gap-3">
                <button onclick="copiarTudoFicha()" class="bg-emerald-600 text-white font-black px-6 py-2 rounded-lg text-xs uppercase flex-1">📋 Copiar Todos os Campos</button>
                <button onclick="document.getElementById('modal-detalhes').style.display='none'" class="bg-slate-200 font-black px-6 py-2 rounded-lg text-xs uppercase">Fechar</button>
            </div>
        </div>
    </div>

    <!-- BALÃO FLUTUANTE -->
    <div id="btn-sugestao-flutuante" onclick="togglePainelSugestoes()">💡</div>
    <div id="painel-sugestoes">
        <div class="bg-blue-600 p-4 text-white font-black text-[10px] flex justify-between items-center uppercase"><span>💡 Sugestões</span><button onclick="togglePainelSugestoes()">✕</button></div>
        <textarea id="texto-melhorias" class="flex-1 p-4 text-sm font-bold uppercase border-0 outline-none resize-none" oninput="autoSalvarNotas()"></textarea>
    </div>

    <datalist id="listaSugestaoProdutos"></datalist>
    <datalist id="listaSugestaoClientes"></datalist>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA_fQSZJJcz5Wszw54W5EhMN9D5rNnjoCo",
            authDomain: "mercier-design.firebaseapp.com",
            projectId: "mercier-design",
            storageBucket: "mercier-design.firebasestorage.app",
            messagingSenderId: "1060891658513",
            appId: "1:1060891658513:web:2eefd15227203af39064b0",
            databaseURL: "https://mercier-design-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let pedidos = [], fornecedores = [], estoque = [], catalogo = [], assistencias = [], tarefas = [], proximoID = 255, notasMelhoria = "", filtrandoNaoEnviados = false;
        let cpfValido = true;

        db.ref('dados').on('value', (s) => {
            const d = s.val() || {};
            pedidos = d.pedidos || []; fornecedores = d.fornecedores || []; estoque = d.estoque || []; catalogo = d.catalogo || []; assistencias = d.assistencias || []; tarefas = d.tarefas || []; proximoID = d.proximoID || 255; notasMelhoria = d.notasMelhoria || "";
            document.getElementById('status-db').innerText = "SINCRONIZADO";
            document.getElementById('status-db').className = "text-[10px] px-4 py-1.5 rounded-full bg-green-600 font-black text-white uppercase";
            document.getElementById('texto-melhorias').value = notasMelhoria;
            atualizarSugestoes(); atualizarSelectsFornecedores(); renderPedidos(); renderEstoque(); renderCatalogo(); renderTarefas();
        });

        function salvarCloud() { db.ref('dados').set({ pedidos, fornecedores, estoque, catalogo, assistencias, tarefas, proximoID, notasMelhoria }); }

        // --- MÁSCARAS ---
        function maskMoney(i) { let v = i.value.replace(/\D/g, ""); v = (v/100).toFixed(2).replace(".",","); v = v.replace(/(\d)(?=(\d{3})+(?!\d))/g,"$1."); i.value="R$ "+v; if(i.classList.contains('t-v-desc')) calcularTotalPedidoTarefa(); }
        function maskCPF(i) { let v = i.value.replace(/\D/g, ""); if (v.length > 11) v = v.slice(0, 11); v = v.replace(/(\d{3})(\d)/, "$1.$2"); v = v.replace(/(\d{3})(\d)/, "$1.$2"); v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2"); i.value = v; if(v.length === 14) verificarCPF(i); }
        function validarCPF(cpf) { cpf = cpf.replace(/[^\d]+/g,''); if(cpf.length !== 11 || !!cpf.match(/(\d)\1{10}/)) return false; let add = 0; for (let i=0; i < 9; i ++) add += parseInt(cpf.charAt(i)) * (10 - i); let rev = 11 - (add % 11); if (rev === 10 || rev === 11) rev = 0; if (rev !== parseInt(cpf.charAt(9))) return false; add = 0; for (let i = 0; i < 10; i ++) add += parseInt(cpf.charAt(i)) * (11 - i); rev = 11 - (add % 11); if (rev === 10 || rev === 11) rev = 0; if (rev !== parseInt(cpf.charAt(10))) return false; return true; }
        function verificarCPF(i) { const label = document.getElementById('label-cpf-status'); if(validarCPF(i.value)) { i.classList.remove('input-error'); i.classList.add('input-success'); if(label) label.innerText = "OK"; cpfValido = true; } else { i.classList.add('input-error'); if(label) label.innerText = "INVÁLIDO!"; cpfValido = false; } }
        async function buscarCEP(i) { const c = i.value.replace(/\D/g,""); if(c.length===8) { try { const r = await fetch(`https://viacep.com.br/ws/${c}/json/`); const d = await r.json(); if(!d.erro){ document.getElementById('t_end').value=d.logradouro.toUpperCase(); document.getElementById('t_bairro').value=d.bairro.toUpperCase(); } } catch(e){} } }

        // --- TAREFAS ---
        function mostrarCamposTarefa(t) {
            const c = document.getElementById('container-campos-tarefa'); c.innerHTML = "";
            if(t==='TIRAR PEDIDO') {
                c.innerHTML = `
                <input type="text" id="t_nome" placeholder="NOME COMPLETO" class="border-2 p-2 rounded-lg text-xs font-bold">
                <div class="flex flex-col"><span id="label-cpf-status" class="text-[8px] font-black"></span><input type="text" id="t_cpf" placeholder="CPF" class="border-2 p-2 rounded-lg text-xs font-bold" oninput="maskCPF(this)"></div>
                <input type="text" id="t_cep" placeholder="CEP" class="border-2 p-2 rounded-lg text-xs font-bold" oninput="buscarCEP(this)">
                <input type="text" id="t_end" placeholder="ENDEREÇO" class="border-2 p-2 rounded-lg text-xs font-bold col-span-2">
                <input type="text" id="t_bairro" placeholder="BAIRRO" class="border-2 p-2 rounded-lg text-xs font-bold">
                <input type="text" id="t_num" placeholder="NÚMERO" class="border-2 p-2 rounded-lg text-xs font-bold">
                <input type="text" id="t_torre" placeholder="TORRE/APTO" class="border-2 p-2 rounded-lg text-xs font-bold">
                <input type="text" id="t_contato" placeholder="CONTATO" class="border-2 p-2 rounded-lg text-xs font-bold">
                <div class="col-span-3 border-t mt-2 pt-2"><div id="lista-prods-t" class="space-y-2"><div class="flex gap-2 items-end"><div class="flex-1 flex flex-col"><label class="text-[8px] font-bold">MÓVEL</label><input type="text" class="t-prod border-2 p-2 rounded text-xs font-bold"></div><div class="w-24 flex flex-col"><label class="text-[8px] font-bold">ORIGINAL</label><input type="text" class="t-v-orig border-2 p-2 rounded text-xs font-bold" oninput="maskMoney(this)"></div><div class="w-24 flex flex-col"><label class="text-[8px] font-bold">DESC.</label><input type="text" class="t-v-desc border-2 p-2 rounded text-xs font-bold" oninput="maskMoney(this)"></div><button onclick="this.parentElement.remove(); calcularTotalPedidoTarefa();">✖</button></div></div><button onclick="addProdT()" class="text-[9px] font-bold text-blue-600 mt-2">+ PRODUTO</button><div id="total-pedido-tarefa" class="text-xs font-black mt-2 text-indigo-600">TOTAL: R$ 0,00</div></div>
                <div class="col-span-3 border-t mt-2 pt-2"><div id="lista-pags-t" class="space-y-2"><div class="flex flex-col gap-2 p-2 bg-slate-50 rounded-lg border"><div class="flex gap-1 flex-wrap"><button onclick="setPag(this,'PIX')" class="btn-pag-opt active">PIX</button><button onclick="setPag(this,'CRÉDITO')" class="btn-pag-opt">CRÉDITO</button><button onclick="setPag(this,'DÉBITO')" class="btn-pag-opt">DÉBITO</button><button onclick="setPag(this,'CHEQUE')" class="btn-pag-opt">CHEQUE</button><input type="hidden" class="t-p-forma" value="PIX"></div><div class="flex gap-2"><input type="text" placeholder="VALOR" class="t-p-val border-2 p-1.5 rounded text-xs font-bold flex-1" oninput="maskMoney(this)"><input type="text" placeholder="DATA" class="t-p-data border-2 p-1.5 rounded text-xs font-bold w-32"></div></div></div><button onclick="addPagT()" class="text-[9px] font-bold text-blue-600 mt-2">+ PAGAMENTO</button></div>
                <textarea id="t_obs" placeholder="OBS..." class="col-span-3 border-2 p-2 rounded text-xs font-bold h-16 mt-2"></textarea>`;
            } else if(t==='SIMPLES') c.innerHTML = `<div class="col-span-3"><input type="text" id="t_desc_raw" placeholder="DESCREVA A TAREFA..." class="border-2 p-3 rounded-xl text-xs font-bold w-full"></div>`;
            else c.innerHTML = `<input type="text" id="t_cli" placeholder="CLIENTE" class="border-2 p-2 rounded text-xs font-bold"><input type="text" id="t_info" placeholder="DETALHES..." class="border-2 p-2 rounded text-xs font-bold col-span-2">`;
        }

        function addProdT() { const d = document.getElementById('lista-prods-t'); const r = document.createElement('div'); r.className="flex gap-2 items-end"; r.innerHTML = `<div class="flex-1 flex flex-col"><label class="text-[8px] font-bold">MÓVEL</label><input type="text" class="t-prod border-2 p-2 rounded text-xs font-bold"></div><div class="w-24 flex flex-col"><label class="text-[8px] font-bold">ORIGINAL</label><input type="text" class="t-v-orig border-2 p-2 rounded text-xs font-bold" oninput="maskMoney(this)"></div><div class="w-24 flex flex-col"><label class="text-[8px] font-bold">DESC.</label><input type="text" class="t-v-desc border-2 p-2 rounded text-xs font-bold" oninput="maskMoney(this)"></div><button onclick="this.parentElement.remove(); calcularTotalPedidoTarefa();">✖</button>`; d.appendChild(r); }
        function addPagT() { const d = document.getElementById('lista-pags-t'); const r = document.createElement('div'); r.className="flex flex-col gap-2 p-2 bg-slate-50 rounded-lg border mt-2"; r.innerHTML = `<div class="flex gap-1 flex-wrap"><button onclick="setPag(this,'PIX')" class="btn-pag-opt active">PIX</button><button onclick="setPag(this,'CRÉDITO')" class="btn-pag-opt">CRÉDITO</button><button onclick="setPag(this,'DÉBITO')" class="btn-pag-opt">DÉBITO</button><button onclick="setPag(this,'CHEQUE')" class="btn-pag-opt">CHEQUE</button><input type="hidden" class="t-p-forma" value="PIX"></div><div class="flex gap-2"><input type="text" placeholder="VALOR" class="t-p-val border-2 p-1.5 rounded text-xs font-bold flex-1" oninput="maskMoney(this)"><input type="text" placeholder="DATA" class="t-p-data border-2 p-1.5 rounded text-xs font-bold w-32"><button onclick="this.parentElement.parentElement.remove()">✖</button></div>`; d.appendChild(r); }
        function setPag(b,v){ b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); b.parentElement.querySelector('input').value=v; }
        function calcularTotalPedidoTarefa() { let t=0; document.querySelectorAll('.t-v-desc').forEach(i=>{ let v=i.value.replace("R$ ","").replace(/\./g,"").replace(",","."); t+=parseFloat(v)||0; }); document.getElementById('total-pedido-tarefa').innerText="TOTAL: R$ "+t.toLocaleString('pt-BR',{minimumFractionDigits:2}); }

        function cadastrarTarefa() { 
            const tipo = document.getElementById('t_tipo').value; 
            if(tipo === 'TIRAR PEDIDO' && !cpfValido) return alert("CPF INVÁLIDO!");
            
            let dataTarefa = { uid: Date.now(), data: new Date().toLocaleDateString('pt-BR'), tipo, status: "Não Iniciado" };
            
            if(tipo === 'TIRAR PEDIDO') {
                const prods = Array.from(document.querySelectorAll('#lista-prods-t > div')).map(row => ({
                    nome: row.querySelector('.t-prod').value,
                    vOrig: row.querySelector('.t-v-orig').value,
                    vDesc: row.querySelector('.t-v-desc').value
                }));
                const pags = Array.from(document.querySelectorAll('#lista-pags-t > div')).map(row => ({
                    forma: row.querySelector('.t-p-forma').value,
                    valor: row.querySelector('.t-p-val').value,
                    data: row.querySelector('.t-p-data').value
                }));
                dataTarefa.detalhes = {
                    nome: document.getElementById('t_nome').value.toUpperCase(),
                    cpf: document.getElementById('t_cpf').value,
                    cep: document.getElementById('t_cep').value,
                    endereco: document.getElementById('t_end').value.toUpperCase(),
                    bairro: document.getElementById('t_bairro').value.toUpperCase(),
                    numero: document.getElementById('t_num').value,
                    torre: document.getElementById('t_torre').value.toUpperCase(),
                    contato: document.getElementById('t_contato').value,
                    produtos: prods,
                    pagamentos: pags,
                    obs: document.getElementById('t_obs').value.toUpperCase()
                };
                dataTarefa.descricao = "PEDIDO: " + dataTarefa.detalhes.nome;
            } else if(tipo === 'SIMPLES') {
                dataTarefa.descricao = document.getElementById('t_desc_raw').value.toUpperCase();
            } else {
                dataTarefa.descricao = tipo + ": " + document.getElementById('t_cli').value.toUpperCase();
            }

            if(!dataTarefa.descricao) return alert("Preencha!");
            tarefas.unshift(dataTarefa); 
            salvarCloud(); 
            mostrarCamposTarefa(tipo);
        }

        function renderTarefas() {
            const tb = document.getElementById('tabelaTarefas'); if(!tb) return;
            const f = document.getElementById('filtro-tarefa').value;
            let l = f === 'TODAS' ? tarefas : tarefas.filter(x => x.status === f);
            tb.innerHTML = l.map(x => {
                let sCls = x.status === 'Feito' ? 'bg-green-600' : (x.status === 'Em Andamento' ? 'bg-orange-500' : 'bg-slate-400');
                return `<tr class="hover:bg-slate-50 cursor-pointer" onclick="verDetalhesTarefa(${x.uid})">
                    <td>${x.data}</td><td class="font-black text-xs uppercase">${x.descricao}</td><td class="text-[9px] font-black opacity-50 uppercase">${x.tipo}</td>
                    <td><button onclick="event.stopPropagation(); cycleTarefaStatus(${x.uid})" class="status-badge ${sCls} text-white">${x.status}</button></td>
                    <td class="text-center"><button onclick="event.stopPropagation(); tarefas=tarefas.filter(y=>y.uid!=${x.uid});salvarCloud();" class="text-red-500 font-bold px-2">✖</button></td></tr>`;
            }).join('');
        }

        let idTarefaAberta = null;
        function verDetalhesTarefa(uid) {
            const t = tarefas.find(x => x.uid == uid);
            if(!t || !t.detalhes) return;
            idTarefaAberta = uid;
            const c = document.getElementById('detalhe-corpo');
            let h = `<div class="grid grid-cols-2 gap-4 text-xs">
                <div><label class="font-black text-slate-400 uppercase block">Nome</label><input readonly class="w-full bg-slate-50 p-2 rounded" value="${t.detalhes.nome}"></div>
                <div><label class="font-black text-slate-400 uppercase block">CPF</label><input readonly class="w-full bg-slate-50 p-2 rounded" value="${t.detalhes.cpf}"></div>
                <div><label class="font-black text-slate-400 uppercase block">CEP</label><input readonly class="w-full bg-slate-50 p-2 rounded" value="${t.detalhes.cep}"></div>
                <div class="col-span-2"><label class="font-black text-slate-400 uppercase block">Endereço</label><input readonly class="w-full bg-slate-50 p-2 rounded" value="${t.detalhes.endereco}, ${t.detalhes.numero} - ${t.detalhes.bairro}"></div>
                <div><label class="font-black text-slate-400 uppercase block">Torre/Apto</label><input readonly class="w-full bg-slate-50 p-2 rounded" value="${t.detalhes.torre}"></div>
                <div><label class="font-black text-slate-400 uppercase block">Contato</label><input readonly class="w-full bg-slate-50 p-2 rounded" value="${t.detalhes.contato}"></div>
            </div><div class="border-t pt-4"><label class="font-black text-indigo-600 uppercase block mb-2 text-xs">Produtos</label>`;
            
            t.detalhes.produtos.forEach(p => h += `<div class="bg-slate-50 p-2 rounded mb-2 text-[11px] font-bold">${p.nome} | Orig: ${p.vOrig} | Desc: ${p.vDesc}</div>`);
            
            h += `</div><div class="border-t pt-4"><label class="font-black text-indigo-600 uppercase block mb-2 text-xs">Pagamentos</label>`;
            t.detalhes.pagamentos.forEach(p => h += `<div class="bg-slate-50 p-2 rounded mb-2 text-[11px] font-bold">${p.forma}: ${p.valor} em ${p.data}</div>`);
            
            h += `</div><div class="border-t pt-4"><label class="font-black text-slate-400 uppercase block mb-1 text-xs">Observações</label><p class="text-xs font-bold uppercase">${t.detalhes.obs || '-'}</p></div>`;
            
            c.innerHTML = h;
            document.getElementById('modal-detalhes').style.display = 'flex';
        }

        function copiarTudoFicha() {
            const t = tarefas.find(x => x.uid == idTarefaAberta);
            if(!t || !t.detalhes) return;
            let txt = `CLIENTE: ${t.detalhes.nome}\nCPF: ${t.detalhes.cpf}\nCEP: ${t.detalhes.cep}\nENDEREÇO: ${t.detalhes.endereco}, ${t.detalhes.numero} - ${t.detalhes.bairro}\nCONTATO: ${t.detalhes.contato}\n\nPRODUTOS:\n`;
            t.detalhes.produtos.forEach(p => txt += `- ${p.nome} (${p.vDesc})\n`);
            txt += `\nPAGAMENTO:\n`;
            t.detalhes.pagamentos.forEach(p => txt += `- ${p.forma}: ${p.valor} (${p.data})\n`);
            txt += `\nOBS: ${t.detalhes.obs}`;
            navigator.clipboard.writeText(txt); alert("Ficha copiada!");
        }

        // --- SISTEMA GERAL ---
        function switchTab(t){ document.querySelectorAll('main').forEach(x=>x.classList.add('hidden')); document.getElementById('view-'+t).classList.remove('hidden'); document.querySelectorAll('nav button').forEach(x=>x.classList.remove('tab-active')); document.getElementById('tab-'+t).classList.add('tab-active'); if(t==='tarefas') mostrarCamposTarefa(document.getElementById('t_tipo').value); if(t==='pedidos') renderPedidos(); if(t==='catalogo') renderCatalogo(); }
        function renderPedidos() { const tb=document.getElementById('tabelaPedidos'); if(!tb) return; const b=document.getElementById('busca').value.toLowerCase(); let l=pedidos.filter(x=>(x.cliente||"").toLowerCase().includes(b)||(x.produto||"").toLowerCase().includes(b)||(x.idDoc||"").toLowerCase().includes(b)); if(filtrandoNaoEnviados) l=l.filter(x=>x.status==="Não enviado"); document.getElementById('contador').innerText=l.length+" PEDIDOS"; tb.innerHTML = l.map(x=>{ const p=calcP(x.dataPedido,x.prazo); let sCls=x.status==="Não enviado"?"bg-red-600":(x.status.includes("enviado")?"bg-blue-600":"bg-green-700"); return `<tr class="${p.classe}"><td><input type="checkbox"></td><td><div class="flex flex-col gap-1"><span class="bg-black text-white text-[9px] px-1 text-center rounded font-black">${p.dias}D</span></div></td><td class="text-xs font-bold text-slate-500">${x.idDoc}</td><td onclick="editField(${x.uid},'cliente')" class="editable-cell uppercase">${x.cliente}</td><td>${x.dataPedido}</td><td class="text-center font-black">${x.qtd}</td><td class="uppercase text-[11px]">${x.produto}</td><td>${x.medida||'-'}</td><td class="uppercase">${x.cor||'-'}</td><td>R$ ${x.custo||0}</td><td class="text-[9px] italic">${x.pendencia||'-'}</td><td class="text-[10px] font-black text-blue-800 uppercase">${x.fornecedor||'-'}</td><td><button onclick="cycleStatus(${x.uid})" class="status-badge ${sCls} text-white">${x.status}</button></td><td><button class="status-badge ${x.whatsEnviado?'btn-sim':'btn-nao'} font-black">${x.whatsEnviado?'SIM':'NÃO'}</button></td><td><button class="status-badge ${x.confirmado?'btn-sim':'btn-nao'} font-black">${x.confirmado?'SIM':'NÃO'}</button></td><td><button onclick="excluirPedido(${x.uid})" class="text-red-500">✖</button></td></tr>`; }).join(''); }
        function renderEstoque() { const tb=document.getElementById('tabelaEstoque'); if(!tb) return; tb.innerHTML=estoque.map(x=>`<tr><td class="font-black text-xs uppercase">${x.produto}</td><td>${x.qtd}</td><td><span class="px-2 py-1 rounded-full text-[9px] font-black">${x.situacao}</span></td><td><button onclick="estoque=estoque.filter(y=>y.uid!=${x.uid});salvarCloud();">✖</button></td></tr>`).join(''); }
        function renderCatalogo() { const tb=document.getElementById('tabelaCatalogo'); if(!tb) return; tb.innerHTML=catalogo.map((c,i)=>`<tr><td class="font-black text-xs uppercase">${c.nome}</td><td>${c.medida}</td><td>${c.cor}</td><td>${c.situacao}</td><td><button onclick="catalogo.splice(${i},1);salvarCloud();" class="text-red-500">✖</button></td></tr>`).join(''); }
        function cycleTarefaStatus(u){ const x=tarefas.find(y=>y.uid==u); const s=["Não Iniciado","Em Andamento","Feito"]; x.status=s[(s.indexOf(x.status)+1)%s.length]; salvarCloud(); }
        function cycleStatus(u){ const x=pedidos.find(y=>y.uid==u); const s=["Não enviado","Pedido enviado ao fornecedor","Pedido chegou na loja"]; x.status=s[(s.indexOf(x.status)+1)%s.length]; salvarCloud(); }
        function togglePainelSugestoes(){ const p=document.getElementById('painel-sugestoes'); p.style.display=p.style.display==='flex'?'none':'flex'; }
        function autoSalvarNotas(){ notasMelhoria=document.getElementById('texto-melhorias').value; db.ref('dados/notasMelhoria').set(notasMelhoria); }
        function toggleFiltroNaoEnviado() { filtrandoNaoEnviados = !filtrandoNaoEnviados; document.getElementById('btnFiltroNaoEnviado').classList.toggle('bg-red-600'); document.getElementById('btnFiltroNaoEnviado').classList.toggle('text-white'); renderPedidos(); }
        function atualizarSelectsFornecedores(){ const h = fornecedores.map(f => `<option value="${f.nome}">${f.nome}</option>`).join(''); if(document.getElementById('m_fornecedor_select')) document.getElementById('m_fornecedor_select').innerHTML = h || "<option>...</option>"; if(document.getElementById('e_fornecedor_select')) document.getElementById('e_fornecedor_select').innerHTML = h || "<option>...</option>"; }
        function atualizarSugestoes(){ document.getElementById('listaSugestaoProdutos').innerHTML=catalogo.map(c=>`<option value="${c.nome}">`).join(''); const n=[...new Set(pedidos.map(p=>p.cliente))].sort(); document.getElementById('listaSugestaoClientes').innerHTML=n.map(x=>`<option value="${x}">`).join(''); }
        function calcP(d, pr){ if(!d)return{dias:0,classe:""}; try { const pA=d.split("/"); const dt=new Date(pA[2], pA[1]-1, pA[0]); let dF=new Date(dt); dF.setDate(dF.getDate()+parseInt(pr||30)); const df=Math.ceil((dF-new Date())/86400000); let c=df<0?"prazo-vencido":(df<=5?"prazo-urgente":(df<=10?"prazo-alerta":(df<=20?"prazo-atencao":""))); return {dias:df,classe:c}; } catch(e){return {dias:0,classe:""}} }
        function cadastrarEstoque() { estoque.unshift({ uid: Date.now(), produto: document.getElementById('e_produto').value.toUpperCase(), cor: document.getElementById('e_cor').value.toUpperCase(), medida: document.getElementById('e_medida').value, fornecedor: document.getElementById('e_fornecedor_select').value, qtd: document.getElementById('e_qtd').value, situacao: document.getElementById('e_situacao').value }); salvarCloud(); }
        function cadastrarCatalogo() { catalogo.push({ nome: document.getElementById('cat_nome').value.toUpperCase(), medida: document.getElementById('cat_medida').value, cor: document.getElementById('cat_cor').value.toUpperCase(), situacao: document.getElementById('cat_situacao').value }); salvarCloud(); document.getElementById('cat_nome').value = ""; }
        function marcarTodos(v){ filtrandoNaoEnviados=false; renderPedidos(); }
        function limparBusca(){ document.getElementById('busca').value=""; renderPedidos(); }
        function editField(u,f){ const x=pedidos.find(y=>y.uid==u); let n=prompt(`Editar:`,x[f]||""); if(n!==null){ x[f]=n.toUpperCase(); salvarCloud(); } }
        function excluirPedido(u){ if(confirm("Excluir?")){ pedidos=pedidos.filter(x=>x.uid!=u); salvarCloud(); } }
        function adicionarItemAoCesto() { const p = document.getElementById('m_produto').value.trim().toUpperCase(); if(!p) return; cestoItensTemporario.push({ qtd: document.getElementById('m_qtd').value, produto: p, medida: document.getElementById('m_medida').value, cor: document.getElementById('m_cor').value.toUpperCase() }); document.getElementById('cesto-itens').innerText = "Cesto: " + cestoItensTemporario.length + " itens"; document.getElementById('m_produto').value = ""; }
        function cadastrarManual() { const cli = document.getElementById('m_cliente').value.trim().toUpperCase(); const forn = document.getElementById('m_fornecedor_select').value; if(!cli || cestoItensTemporario.length === 0) return alert("Falta preencher!"); const idDoc = "ID#" + proximoID.toString().padStart(4, '0'); proximoID++; const data = new Date().toLocaleDateString('pt-BR'); cestoItensTemporario.forEach(i => pedidos.unshift({ uid: Date.now() + Math.random(), idDoc, cliente: cli, dataPedido: data, qtd: i.qtd, produto: i.produto, medida: i.medida, cor: i.cor, fornecedor: forn, prazo: document.getElementById('m_prazo_select').value, status: "Não enviado", whatsEnviado: false, confirmado: false })); cestoItensTemporario = []; document.getElementById('m_cliente').value = ""; document.getElementById('cesto-itens').innerText = ""; salvarCloud(); }
    </script>
</body>
</html>
