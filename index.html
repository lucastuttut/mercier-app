<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercier Design - Gestão Cloud Elite v60.0</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; color: #000; margin: 0; padding: 0; }
        .glass-header { background: #0f172a; border-bottom: 4px solid #3b82f6; }
        .card-premium { background: white; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: 1px solid #e2e8f0; }
        
        .prazo-vencido { background-color: #fecaca !important; border-left: 8px solid #b91c1c !important; animation: pulse-red 2s infinite; }
        .prazo-urgente { background-color: #fee2e2 !important; border-left: 8px solid #ef4444 !important; }
        .prazo-alerta { background-color: #ffedd5 !important; border-left: 8px solid #f97316 !important; }
        .prazo-atencao { background-color: #fef9c3 !important; border-left: 8px solid #eab308 !important; }
        @keyframes pulse-red { 0% { background-color: #fecaca; } 50% { background-color: #f87171; } 100% { background-color: #fecaca; } }

        .status-badge { font-size: 9px; font-weight: 900; padding: 8px; border-radius: 6px; text-transform: uppercase; width: 100%; text-align: center; cursor: pointer; border: none; }
        .btn-sim { background-color: #15803d !important; color: white !important; }
        .btn-nao { background-color: #b91c1c !important; color: white !important; }
        .tab-active { border-bottom: 4px solid #3b82f6; color: #3b82f6; font-weight: 800; }
        
        th { font-size: 10px; font-weight: 900; text-transform: uppercase; color: #64748b; padding: 12px; border-bottom: 2px solid #3b82f6; background: #fff; }
        td { padding: 8px 12px !important; font-weight: 700; color: #0f172a; border-bottom: 1px solid #f1f5f9; }
        input, select, textarea { text-transform: uppercase; outline: none; }
        .editable-cell:hover { background-color: #f8fafc; cursor: pointer; text-decoration: underline; color: #3b82f6; }
        
        #btn-sugestao-flutuante { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; background: #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 15px rgba(59,130,246,0.5); cursor: pointer; z-index: 100; }
        #painel-sugestoes { position: fixed; bottom: 90px; right: 24px; width: 320px; height: 450px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 101; display: none; flex-direction: column; border: 1px solid #e2e8f0; }

        .btn-pag-opt { background: #f1f5f9; padding: 6px 12px; border-radius: 8px; font-size: 10px; font-weight: 800; border: 2px solid transparent; cursor: pointer; }
        .btn-pag-opt.active { background: #3b82f6; color: white; border-color: #2563eb; }
        .input-error { border-color: #ef4444 !important; background-color: #fef2f2 !important; }
        .input-success { border-color: #22c55e !important; background-color: #f0fdf4 !important; }
        
        #modal-detalhes { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
        .copy-btn-small { cursor: pointer; color: #64748b; font-size: 14px; transition: 0.2s; }
        .copy-btn-small:hover { color: #3b82f6; transform: scale(1.2); }
    </style>
</head>
<body>

    <header class="glass-header text-white p-5 shadow-xl flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-2xl font-black tracking-tighter uppercase">MERCIER DESIGN</h1>
        <div id="status-db" class="text-[10px] px-4 py-1.5 rounded-full bg-orange-500 font-black text-white uppercase tracking-widest">Conectando...</div>
    </header>

    <nav class="bg-slate-900 text-slate-400 px-8 flex gap-8 shadow-md overflow-x-auto">
        <button onclick="switchTab('pedidos')" id="tab-pedidos" class="py-4 text-xs font-black uppercase tab-active whitespace-nowrap">📋 Pedidos</button>
        <button onclick="switchTab('tarefas')" id="tab-tarefas" class="py-4 text-xs font-black uppercase whitespace-nowrap">📝 Tarefas</button>
        <button onclick="switchTab('assistencia')" id="tab-assistencia" class="py-4 text-xs font-black uppercase whitespace-nowrap">🛠️ Assistências</button>
        <button onclick="switchTab('estoque')" id="tab-estoque" class="py-4 text-xs font-black uppercase whitespace-nowrap">📦 Estoque</button>
        <button onclick="switchTab('catalogo')" id="tab-catalogo" class="py-4 text-xs font-black uppercase whitespace-nowrap">📜 Catálogo</button>
        <button onclick="switchTab('fornecedores')" id="tab-fornecedores" class="py-4 text-xs font-black uppercase whitespace-nowrap">🏭 Fábricas</button>
    </nav>

    <!-- ABA PEDIDOS -->
    <main id="view-pedidos" class="max-w-[1950px] mx-auto p-4 md:p-6">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-6">
            <div class="card-premium p-4 flex flex-col justify-center bg-slate-50 border-2 border-dashed border-slate-300"><input type="file" id="pdfInput" accept="application/pdf" class="text-[10px] cursor-pointer"></div>
            <div class="lg:col-span-3 card-premium p-5 border-l-8 border-blue-600">
                <div class="flex flex-wrap gap-3 mb-4">
                    <input list="listaSugestaoClientes" id="m_cliente" placeholder="NOME DO CLIENTE" class="border-2 p-2 rounded-lg text-xs font-bold flex-1 outline-blue-500">
                    <select id="m_prazo_select" class="border-2 p-2 rounded-lg text-xs font-bold w-32 bg-white">
                        <option value="15">15 Dias</option><option value="20">20 Dias</option><option value="30" selected>30 Dias</option><option value="30-util">30 Úteis</option><option value="40-util">40 Úteis</option>
                    </select>
                    <select id="m_fornecedor_select" class="border-2 p-2 rounded-lg text-xs font-bold w-48 bg-white"></select>
                </div>
                <div class="flex flex-wrap gap-2 mb-3 bg-slate-50 p-3 rounded-xl border">
                    <input type="number" id="m_qtd" value="1" class="border-2 p-1.5 rounded-lg text-xs font-bold w-16">
                    <input list="listaSugestaoProdutos" id="m_produto" placeholder="PRODUTO" class="border-2 p-1.5 rounded-lg text-xs font-bold flex-1">
                    <input type="text" id="m_medida" placeholder="MEDIDA" class="border-2 p-1.5 rounded-lg text-xs font-bold w-24">
                    <input type="text" id="m_cor" placeholder="COR/TECIDO" class="border-2 p-1.5 rounded-lg text-xs font-bold w-32">
                    <input type="text" id="m_custo" placeholder="R$ CUSTO" class="border-2 p-1.5 rounded-lg text-xs font-bold w-24" oninput="maskMoney(this)">
                    <input type="text" id="m_pendencia" placeholder="PENDÊNCIA / OBS" class="border-2 p-1.5 rounded-lg text-xs font-bold flex-1">
                    <button onclick="adicionarItemAoCesto()" class="bg-slate-800 text-white px-6 rounded-lg text-[10px] font-black hover:bg-black transition">＋ ITEM</button>
                </div>
                <div id="cesto-itens" class="text-[11px] font-bold text-blue-600 mb-3 italic px-2"></div>
                <button onclick="cadastrarManual()" class="bg-blue-600 text-white font-black rounded-xl text-xs px-8 py-3.5 w-full uppercase shadow-lg hover:bg-blue-700 transition">Finalizar e Sincronizar Pedido</button>
            </div>
        </div>

        <div class="card-premium overflow-hidden">
            <div class="p-4 bg-white border-b flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <input type="text" id="busca" onkeyup="renderPedidos()" placeholder="🔍 BUSCAR CLIENTE, MÓVEL OU FÁBRICA..." class="border-2 border-slate-100 px-5 py-2.5 rounded-2xl text-xs w-full md:w-96 font-bold outline-blue-500">
                    <button onclick="limparBusca()" class="text-slate-400 font-bold px-2">✕</button>
                    <button id="btnFiltroNaoEnviado" onclick="toggleFiltroNaoEnviado()" class="border-2 border-red-500 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase text-red-600 tracking-tighter">Não enviados</button>
                    <button onclick="gerarEmailLote()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-[10px] font-black uppercase shadow hover:bg-emerald-700">📧 Enviar Selecionados</button>
                </div>
                <span id="contador" class="text-[10px] font-black bg-slate-900 text-white px-4 py-2 rounded-lg uppercase">0 Itens</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr>
                            <th width="40"><input type="checkbox" id="masterCheck" onclick="marcarTodos(this.checked)"></th>
                            <th>Prazo</th><th>ID</th><th>Cliente</th><th>Data</th><th>Qtd</th><th>Móvel</th><th>Medida</th><th>Cor</th><th>Custo</th><th>Status</th><th>Whats?</th><th>Conf?</th><th class="text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaPedidos"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- ABA TAREFAS -->
    <main id="view-tarefas" class="hidden max-w-[1200px] mx-auto p-4 md:p-6">
        <div class="card-premium p-6 border-l-8 border-indigo-600 mb-6">
            <h2 class="text-xs font-black text-slate-400 uppercase mb-4 tracking-wider">Nova Tarefa</h2>
            <select id="t_tipo" onchange="mostrarCamposTarefa(this.value)" class="border-2 p-3 rounded-xl text-xs font-bold bg-white mb-4 outline-indigo-500">
                <option value="SIMPLES">Anotação Simples</option>
                <option value="TIRAR PEDIDO">Tirar Pedido (Ficha)</option>
                <option value="MARCAR ENTREGA">Marcar Entrega</option>
                <option value="ASSISTENCIA FÁBRICA">Enviar Assistência p/ Fábrica</option>
                <option value="PEDIDO FÁBRICA">Enviar Pedido p/ Fábrica</option>
                <option value="LOGÍSTICA">Levar/Trazer do Depósito</option>
                <option value="RETORNO CLIENTE">Dar Retorno para Cliente</option>
            </select>
            <div id="container-campos-tarefa" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
            <button onclick="cadastrarTarefa()" class="bg-indigo-600 text-white font-black px-12 py-3.5 rounded-xl text-xs uppercase shadow-lg hover:bg-indigo-700 transition mt-4">Salvar na Lista</button>
        </div>
        <div class="card-premium overflow-hidden">
            <div class="p-4 bg-white border-b flex justify-between items-center"><select id="filtro-tarefa" onchange="renderTarefas()" class="border-2 p-2 rounded-lg text-[10px] font-black uppercase bg-white"><option value="TODAS">Ver Todas</option><option value="Não Iniciado">Não Iniciado</option><option value="Em Andamento">Em Andamento</option><option value="Feito">Feito</option></select></div>
            <table class="w-full text-left"><thead><tr class="bg-slate-50"><th>Data</th><th>Tarefa</th><th>Tipo</th><th>Status</th><th class="text-center">Remover</th></tr></thead><tbody id="tabelaTarefas"></tbody></table>
        </div>
    </main>

    <!-- ABA ASSISTÊNCIA -->
    <main id="view-assistencia" class="hidden max-w-[1950px] mx-auto p-4 md:p-6">
        <div class="card-premium p-6 border-l-8 border-orange-500 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-3">
                <input list="listaSugestaoClientes" id="as_cliente" placeholder="CLIENTE" class="border-2 p-2 rounded-lg text-xs font-bold">
                <input type="text" id="as_pedido_id" placeholder="ID PEDIDO" class="border-2 p-2 rounded-lg text-xs font-bold">
                <input type="text" id="as_produto" placeholder="PRODUTO" class="border-2 p-2 rounded-lg text-xs font-bold">
                <select id="as_fabrica" class="border-2 p-2 rounded-lg text-xs font-bold bg-white"></select>
            </div>
            <textarea id="as_descricao" placeholder="RELATO DO PROBLEMA..." class="w-full border-2 p-3 rounded-lg text-xs font-bold h-24 mb-3 uppercase"></textarea>
            <button onclick="cadastrarAssistencia()" class="bg-orange-600 text-white font-black px-8 py-3 rounded-xl text-xs uppercase shadow-md">Registrar Assistência</button>
        </div>
        <div class="card-premium overflow-hidden"><table class="w-full text-left"><thead><tr><th>Data</th><th>Pedido</th><th>Cliente</th><th>Produto</th><th>Fábrica</th><th>Status</th><th class="text-center">Ações</th></tr></thead><tbody id="tabelaAssistencias"></tbody></table></div>
    </main>

    <!-- ABA ESTOQUE -->
    <main id="view-estoque" class="hidden max-w-[1950px] mx-auto p-6">
        <div class="card-premium p-6 border-l-8 border-blue-600 flex flex-wrap gap-3 items-end mb-6">
            <input id="e_produto" placeholder="PRODUTO" class="border-2 p-2 rounded-lg text-xs font-bold flex-1">
            <input id="e_qtd" type="number" value="1" class="border-2 p-2 rounded-lg text-xs font-bold w-20">
            <select id="e_situacao" class="border-2 p-2 rounded-lg text-xs font-bold bg-white">
                <option value="ESTOQUE">ESTOQUE</option>
                <option value="VENDIDO">VENDIDO</option>
                <option value="DEVOLUÇÃO">DEVOLUÇÃO</option>
                <option value="ASSISTENCIA">ASSISTENCIA</option>
            </select>
            <button onclick="cadastrarEstoque()" class="bg-blue-600 text-white p-2.5 rounded-lg font-black text-xs uppercase">Adicionar</button>
        </div>
        <div class="card-premium overflow-hidden"><table class="w-full text-left"><thead><tr class="bg-slate-50"><th>Móvel</th><th>Qtd</th><th>Situação</th><th>Ação</th></tr></thead><tbody id="tabelaEstoque"></tbody></table></div>
    </main>

    <!-- ABA CATALOGO -->
    <main id="view-catalogo" class="hidden p-6 max-w-[1200px] mx-auto">
        <div class="card-premium p-6 border-l-8 border-blue-600 mb-6 flex gap-2">
            <input id="cat_nome" placeholder="NOME DO MÓVEL" class="border-2 p-2 rounded-lg flex-1 font-bold uppercase">
            <button onclick="cadastrarCatalogo()" class="bg-blue-600 text-white px-8 py-2 rounded-lg font-black text-xs">SALVAR</button>
        </div>
        <div class="card-premium overflow-hidden"><table class="w-full text-left"><thead><tr class="bg-slate-50"><th>Nome</th><th class="text-center">Remover</th></tr></thead><tbody id="tabelaCatalogo"></tbody></table></div>
    </main>

    <!-- ABA FÁBRICAS -->
    <main id="view-fornecedores" class="hidden max-w-4xl mx-auto p-6">
        <div class="card-premium p-6 mb-6 border-l-8 border-blue-600 flex flex-wrap gap-2">
            <input type="text" id="f_nome" placeholder="NOME DA FÁBRICA" class="border-2 p-2 rounded-lg flex-1 font-bold">
            <input type="email" id="f_email" placeholder="EMAIL" class="border-2 p-2 rounded-lg flex-1 font-bold lowercase">
            <button onclick="cadastrarFornecedor()" class="bg-blue-600 text-white px-8 py-2 rounded font-black text-xs uppercase">Salvar</button>
        </div>
        <div class="card-premium overflow-hidden"><table class="w-full text-left"><thead><tr class="bg-slate-50"><th>Fábrica</th><th>E-mail</th><th class="text-center">Remover</th></tr></thead><tbody id="tabelaFornecedores"></tbody></table></div>
    </main>

    <!-- MODAL DETALHES -->
    <div id="modal-detalhes" onclick="if(event.target==this) this.style.display='none'">
        <div class="card-premium w-full max-w-2xl bg-white overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-indigo-600 p-4 text-white font-black flex justify-between items-center uppercase text-sm"><span>Resumo Detalhado</span><button onclick="document.getElementById('modal-detalhes').style.display='none'">✕</button></div>
            <div id="detalhe-corpo" class="p-8 overflow-y-auto space-y-4"></div>
        </div>
    </div>

    <!-- BALÃO FLUTUANTE -->
    <div id="btn-sugestao-flutuante" onclick="togglePainelSugestoes()">💡</div>
    <div id="painel-sugestoes">
        <div class="bg-blue-600 p-4 text-white font-black text-[10px] flex justify-between items-center uppercase tracking-widest"><span>💡 Sugestões</span><button onclick="togglePainelSugestoes()">✕</button></div>
        <textarea id="texto-melhorias" class="flex-1 p-4 text-sm font-bold uppercase border-0 outline-none resize-none" oninput="autoSalvarNotas()"></textarea>
    </div>

    <datalist id="listaSugestaoProdutos"></datalist>
    <datalist id="listaSugestaoClientes"></datalist>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA_fQSZJJcz5Wszw54W5EhMN9D5rNnjoCo",
            authDomain: "mercier-design.firebaseapp.com",
            projectId: "mercier-design",
            storageBucket: "mercier-design.firebasestorage.app",
            messagingSenderId: "1060891658513",
            appId: "1:1060891658513:web:2eefd15227203af39064b0",
            databaseURL: "https://mercier-design-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let pedidos=[], fornecedores=[], estoque=[], catalogo=[], tarefas=[], assistencias=[], proximoID=255, notasMelhoria="", filtrandoNaoEnviados=false, cpfValido=true, idTarefaAberta=null;

        db.ref('dados').on('value', (s) => {
            const d = s.val() || {};
            pedidos=d.pedidos||[]; fornecedores=d.fornecedores||[]; estoque=d.estoque||[]; catalogo=d.catalogo||[]; tarefas=d.tarefas||[]; assistencias=d.assistencias||[]; proximoID=d.proximoID||255; notasMelhoria=d.notasMelhoria||"";
            document.getElementById('status-db').innerText="SINCRONIZADO";
            document.getElementById('status-db').className="text-[10px] px-4 py-1.5 rounded-full bg-green-600 font-black text-white uppercase";
            document.getElementById('texto-melhorias').value=notasMelhoria;
            atualizarSugestoes(); atualizarSelectsFornecedores(); renderPedidos(); renderEstoque(); renderCatalogo(); renderTarefas(); renderFornecedores(); renderAssistencias();
        });

        function salvarCloud(){ db.ref('dados').set({pedidos, fornecedores, estoque, catalogo, tarefas, assistencias, proximoID, notasMelhoria}); }

        // --- ÚTEIS ---
        function formatGrammar(str) { return !str ? "" : str.toLowerCase().replace(/(^\w{1})|(\s+\w{1})/g, l => l.toUpperCase()); }
        function copyText(v){ navigator.clipboard.writeText(formatGrammar(v)); alert("Copiado com Gramática Correta!"); }
        function maskMoney(i){ let v=i.value.replace(/\D/g,""); v=(v/100).toFixed(2).replace(".",","); v=v.replace(/(\d)(?=(\d{3})+(?!\d))/g,"$1."); i.value="R$ "+v; calcTotalT(); }
        function parseMoney(v){ return parseFloat((v||"").replace("R$ ","").replace(/\./g,"").replace(",",".")) || 0; }
        function maskCPF(i){ let v=i.value.replace(/\D/g,""); if(v.length>11)v=v.slice(0,11); v=v.replace(/(\d{3})(\d)/,"$1.$2"); v=v.replace(/(\d{3})(\d)/,"$1.$2"); v=v.replace(/(\d{3})(\d{1,2})$/,"$1-$2"); i.value=v; if(v.length===14) verifCPF(i); }
        function verifCPF(i){ const l=document.getElementById('label-cpf-status'); const ok = validarCPF(i.value); i.className = ok ? "border-2 p-2 rounded-lg text-xs font-bold input-success" : "border-2 p-2 rounded-lg text-xs font-bold input-error"; if(l) l.innerText = ok ? "OK" : "!"; cpfValido=ok; }
        function validarCPF(c){ c=c.replace(/[^\d]+/g,''); if(c.length!==11||!!c.match(/(\d)\1{10}/))return false; let a=0; for(let i=0;i<9;i++)a+=parseInt(c.charAt(i))*(10-i); let r=11-(a%11); if(r===10||r===11)r=0; if(r!==parseInt(c.charAt(9)))return false; a=0; for(let i=0;i<10;i++)a+=parseInt(c.charAt(i))*(11-i); r=11-(a%11); return (r>=10?0:r)===parseInt(c.charAt(10)); }
        async function buscarCEP(i){ let c=i.value.replace(/\D/g,""); if(c.length===8){ try{let r=await fetch(`https://viacep.com.br/ws/${c}/json/`); let d=await r.json(); if(!d.erro){document.getElementById('t_end').value=d.logradouro.toUpperCase(); document.getElementById('t_bairro').value=d.bairro.toUpperCase();}}catch(e){}} }

        // --- TAREFAS ---
        function mostrarCamposTarefa(t){
            const c=document.getElementById('container-campos-tarefa'); c.innerHTML="";
            if(t==='TIRAR PEDIDO'){
                c.innerHTML=`<input id="t_nome" placeholder="NOME" class="border-2 p-2 rounded-lg text-xs font-bold"><input id="t_cpf" placeholder="CPF" class="border-2 p-2 rounded-lg text-xs font-bold" oninput="maskCPF(this)"><input id="t_cep" placeholder="CEP" class="border-2 p-2 rounded-lg text-xs font-bold" oninput="buscarCEP(this)"><input id="t_end" placeholder="ENDEREÇO" class="border-2 p-2 rounded-lg text-xs font-bold col-span-2"><input id="t_bairro" placeholder="BAIRRO" class="border-2 p-2 rounded-lg text-xs font-bold"><input id="t_num" placeholder="NÚMERO" class="border-2 p-2 rounded-lg text-xs font-bold"><input id="t_torre" placeholder="TORRE/APTO" class="border-2 p-2 rounded-lg text-xs font-bold"><input id="t_contato" placeholder="CONTATO" class="border-2 p-2 rounded-lg text-xs font-bold">
                <div class="col-span-3 border-t mt-2 pt-2"><div id="list-p-t" class="space-y-2"><div class="flex gap-2 items-end"><div class="flex-1 flex flex-col"><label class="text-[8px] font-bold uppercase">Móvel</label><input class="t-prod border-2 p-2 rounded text-xs font-bold w-full"></div><div class="w-24 flex flex-col"><label class="text-[8px] font-bold uppercase">Original</label><input class="t-v-orig border-2 p-2 rounded text-xs font-bold w-full" oninput="maskMoney(this)"></div><div class="w-24 flex flex-col"><label class="text-[8px] font-bold uppercase">Desc.</label><input class="t-v-desc border-2 p-2 rounded text-xs font-bold w-full" oninput="maskMoney(this)"></div><button onclick="this.parentElement.remove(); calcTotalT();">✖</button></div></div><button onclick="addPT()" class="text-[9px] font-bold text-blue-600 mt-2">+ PRODUTO</button><div id="total-p-t" class="text-xs font-black mt-2 text-indigo-600 uppercase">TOTAL: R$ 0,00</div></div>
                <div class="col-span-3 border-t mt-2 pt-2"><div id="list-pg-t" class="space-y-2"></div><button onclick="addPgT()" class="text-[9px] font-bold text-blue-600 mt-2">+ PAGAMENTO</button></div><textarea id="t_obs" placeholder="OBS..." class="col-span-3 border-2 p-2 rounded text-xs font-bold h-16 mt-2"></textarea>`;
                addPT(); addPgT();
            } else if(t==='SIMPLES') c.innerHTML = `<div class="col-span-3"><input id="t_raw" placeholder="DESCRIÇÃO DA TAREFA..." class="border-2 p-3 rounded-xl text-xs font-bold w-full"></div>`;
            else c.innerHTML = `<input id="t_cli" placeholder="CLIENTE..." class="border-2 p-2 rounded text-xs font-bold col-span-1"><input id="t_info" placeholder="DETALHES..." class="border-2 p-2 rounded text-xs font-bold col-span-2">`;
        }
        function addPT(){ let d=document.getElementById('list-p-t'); let r=document.createElement('div'); r.className="flex gap-2 items-end mt-2"; r.innerHTML=`<div class="flex-1"><input class="t-prod border-2 p-2 rounded text-xs font-bold w-full"></div><div class="w-24"><input class="t-v-orig border-2 p-2 rounded text-xs font-bold w-full" oninput="maskMoney(this)"></div><div class="w-24"><input class="t-v-desc border-2 p-2 rounded text-xs font-bold w-full" oninput="maskMoney(this)"></div><button onclick="this.parentElement.remove(); calcTotalT();" class="p-2 text-red-500">✖</button>`; d.appendChild(r); }
        function addPgT(){
            let d=document.getElementById('list-pg-t');
            let totV=0; document.querySelectorAll('.t-v-desc').forEach(i=> totV += parseMoney(i.value));
            let totP=0; document.querySelectorAll('.t-p-val').forEach(i=> totP += parseMoney(i.value));
            let saldo = totV - totP;
            let r=document.createElement('div'); r.className="bg-slate-50 p-3 rounded-lg border mt-2 flex flex-col gap-2";
            r.innerHTML=`<div class="flex gap-1 flex-wrap"><button onclick="setPag(this,'PIX')" class="btn-pag-opt active">PIX</button><button onclick="setPag(this,'CRÉDITO')" class="btn-pag-opt">CRÉDITO</button><button onclick="setPag(this,'DÉBITO')" class="btn-pag-opt">DÉBITO</button><button onclick="setPag(this,'CHEQUE')" class="btn-pag-opt">CHEQUE</button><input type="hidden" class="t-p-forma" value="PIX"></div><div class="flex gap-2"><input placeholder="VALOR" class="t-p-val border-2 p-1.5 rounded text-xs font-bold flex-1" oninput="maskMoney(this)" value="${saldo>0?'R$ '+saldo.toLocaleString('pt-BR',{minimumFractionDigits:2}):''}"> <input placeholder="DATA" class="t-p-data border-2 p-1.5 rounded text-xs font-bold w-32"></div>`;
            d.appendChild(r);
        }
        function setPag(b,v){ b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); b.parentElement.querySelector('input').value=v; }
        function calcTotalT(){ let t=0; document.querySelectorAll('.t-v-desc').forEach(i=> t += parseMoney(i.value)); if(document.getElementById('total-p-t')) document.getElementById('total-p-t').innerText="TOTAL: R$ "+t.toLocaleString('pt-BR',{minimumFractionDigits:2}); }

        function cadastrarTarefa(){
            const t=document.getElementById('t_tipo').value;
            if(t==='TIRAR PEDIDO' && !cpfValido) return alert("CPF INVÁLIDO!");
            let obj={ uid:Date.now(), data:new Date().toLocaleDateString('pt-BR'), tipo:t, status:"Não Iniciado" };
            if(t==='TIRAR PEDIDO'){
                obj.detalhes={ nome:document.getElementById('t_nome').value, cpf:document.getElementById('t_cpf').value, cep:document.getElementById('t_cep').value, end:document.getElementById('t_end').value, bairro:document.getElementById('t_bairro').value, num:document.getElementById('t_num').value, torre:document.getElementById('t_torre').value, contato:document.getElementById('t_contato').value, obs:document.getElementById('t_obs').value, prods:[], pags:[] };
                document.querySelectorAll('#list-p-t > div').forEach(r=>{ obj.detalhes.prods.push({n:r.querySelector('.t-prod').value, o:r.querySelector('.t-v-orig').value, d:r.querySelector('.t-v-desc').value}); });
                document.querySelectorAll('#list-pg-t > div').forEach(r=>{ obj.detalhes.pags.push({f:r.querySelector('.t-p-forma').value, v:r.querySelector('.t-p-val').value, dt:r.querySelector('.t-p-data').value}); });
                obj.descricao="PEDIDO: "+obj.detalhes.nome;
            } else if(t==='SIMPLES') obj.descricao=document.getElementById('t_raw').value;
            else obj.descricao=t+": "+(document.getElementById('t_cli')?.value||"");
            if(!obj.descricao) return alert("Preencha!"); tarefas.unshift(obj); salvarCloud(); mostrarCamposTarefa(t);
        }

        function verDetalhesTarefa(uid){
            const t=tarefas.find(x=>x.uid==uid); if(!t) return;
            document.getElementById('modal-detalhes').style.display='flex';
            const c=document.getElementById('detalhe-corpo');
            if(!t.detalhes){ c.innerHTML=`<div class="bg-slate-50 p-6 rounded flex justify-between items-center"><span class="font-black">${t.descricao}</span><i class="cursor-pointer" onclick="copyText('${t.descricao}')">📋</i></div>`; return; }
            let h=`<div class="grid grid-cols-1 gap-3">
                ${r_item('NOME', t.detalhes.nome)} ${r_item('CPF', t.detalhes.cpf)} ${r_item('CEP', t.detalhes.cep)} ${r_item('ENDEREÇO', t.detalhes.end)}
                ${r_item('BAIRRO', t.detalhes.bairro)} ${r_item('NÚMERO', t.detalhes.num)} ${r_item('TORRE/APTO', t.detalhes.torre || '-')} ${r_item('CONTATO', t.detalhes.contato)}
            </div><div class="border-t pt-4">`;
            t.detalhes.prods.forEach(p=>h+=`<div class="bg-slate-50 p-2 rounded mb-1 flex justify-between uppercase text-xs font-bold"><span>${p.n}</span><span>${p.d} <i class="copy-btn-small" onclick="copyText('${p.n} - ${p.d}')">📋</i></span></div>`);
            h+=`</div><div class="border-t pt-4">`;
            t.detalhes.pags.forEach(p=>h+=`<div class="bg-slate-50 p-2 rounded mb-1 flex justify-between uppercase text-xs font-bold"><span>${p.f}</span><span>${p.v} em ${p.dt} <i class="copy-btn-small" onclick="copyText('${p.f} - ${p.v} - ${p.dt}')">📋</i></span></div>`);
            h+=`</div><div class="border-t pt-4 font-bold uppercase text-xs">${t.detalhes.obs || '-'}</div>`;
            c.innerHTML=h;
        }
        function r_item(l,v){ return `<div class="bg-slate-50 p-2 rounded border flex justify-between items-center"><div class="flex flex-col"><label class="text-[8px] font-black text-slate-400">${l}</label><span class="text-xs font-bold uppercase">${v}</span></div><i class="copy-btn-small" onclick="copyText('${v}')">📋</i></div>`; }

        // --- SISTEMA ---
        function switchTab(t){ document.querySelectorAll('main').forEach(x=>x.classList.add('hidden')); document.getElementById('view-'+t).classList.remove('hidden'); document.querySelectorAll('nav button').forEach(x=>x.classList.remove('tab-active')); document.getElementById('tab-'+t).classList.add('tab-active'); if(t==='tarefas') mostrarCamposTarefa('SIMPLES'); }
        function renderPedidos() {
            const tb=document.getElementById('tabelaPedidos'); if(!tb) return;
            const b=document.getElementById('busca').value.toLowerCase();
            let l=pedidos.filter(x=>(x.cliente||"").toLowerCase().includes(b)||(x.produto||"").toLowerCase().includes(b)||(x.idDoc||"").toLowerCase().includes(b));
            if(filtrandoNaoEnviados) l=l.filter(x=>x.status==="Não enviado");
            document.getElementById('contador').innerText=l.length+" PEDIDOS";
            tb.innerHTML = l.map(x=>{
                const p=calcP(x.dataPedido,x.prazo); let sCls=x.status==="Não enviado"?"bg-red-600":(x.status.includes("enviado")?"bg-blue-600":"bg-green-700");
                return `<tr class="${p.classe}"><td><input type="checkbox"></td><td><span class="font-black text-[9px]">${p.dias}D</span></td><td class="text-xs font-bold text-slate-400">${x.idDoc}</td><td onclick="editField(${x.uid},'cliente')" class="editable-cell uppercase">${x.cliente}</td><td>${x.dataPedido}</td><td class="text-center font-black">${x.qtd}</td><td class="uppercase text-[11px] font-black">${x.produto}</td><td>${x.medida||'-'}</td><td class="uppercase">${x.cor||'-'}</td><td>${x.custo||'R$ 0,00'}</td><td><button onclick="cycleStatus(${x.uid})" class="status-badge ${sCls} text-white">${x.status}</button></td><td><button onclick="togPed(${x.uid},'whatsEnviado')" class="status-badge ${x.whatsEnviado?'btn-sim':'btn-nao'}">${x.whatsEnviado?'SIM':'NÃO'}</button></td><td><button onclick="togPed(${x.uid},'confirmado')" class="status-badge ${x.confirmado?'btn-sim':'btn-nao'}">${x.confirmado?'SIM':'NÃO'}</button></td><td class="text-center"><button onclick="excluirPedido(${x.uid})" class="text-red-500 font-black">✖</button></td></tr>`;
            }).join('');
        }
        function renderEstoque() { const tb=document.getElementById('tabelaEstoque'); if(!tb) return; tb.innerHTML=estoque.map(x=>`<tr><td class="font-black uppercase text-xs p-4">${x.produto}</td><td class="p-4">${x.qtd}</td><td class="p-4"><span class="px-2 py-1 rounded text-[9px] font-black sit-estoque">${x.situacao}</span></td><td class="p-4 text-center"><button onclick="estoque=estoque.filter(y=>y.uid!=${x.uid});salvarCloud();" class="text-red-500 font-bold">✖</button></td></tr>`).join(''); }
        function renderCatalogo() { const tb=document.getElementById('tabelaCatalogo'); if(!tb) return; tb.innerHTML=catalogo.map((c,i)=>`<tr><td class="font-black uppercase text-xs p-4">${c.nome}</td><td class="text-center p-4"><button onclick="catalogo.splice(${i},1);salvarCloud();" class="text-red-500 font-bold">✖</button></td></tr>`).join(''); }
        function renderFornecedores() { const tb=document.getElementById('tabelaFornecedores'); if(!tb) return; tb.innerHTML=fornecedores.map((f,i)=>`<tr><td class="p-4 font-black text-xs uppercase">${f.nome}</td><td class="p-4 text-xs lowercase">${f.email}</td><td class="text-center p-4"><button onclick="fornecedores.splice(${i},1);salvarCloud();" class="text-red-500 font-bold">✖</button></td></tr>`).join(''); }
        function renderTarefas() { const tb=document.getElementById('tabelaTarefas'); if(!tb) return; const f=document.getElementById('filtro-tarefa').value; let l=f==='TODAS'?tarefas:tarefas.filter(x=>x.status===f); tb.innerHTML=l.map(x=>` <tr class="hover:bg-slate-50 cursor-pointer" onclick="verDetalhesTarefa(${x.uid})"><td>${x.data}</td><td class="font-black text-xs uppercase">${x.descricao}</td><td class="text-[9px] opacity-40 uppercase font-black">${x.tipo}</td><td><button onclick="event.stopPropagation(); cycleTarefaStatus(${x.uid})" class="status-badge ${x.status==='Feito'?'bg-green-600':(x.status==='Em Andamento'?'bg-orange-500':'bg-slate-400')} text-white">${x.status}</button></td><td class="text-center"><button onclick="event.stopPropagation(); tarefas=tarefas.filter(y=>y.uid!=${x.uid});salvarCloud();" class="text-red-500 font-bold px-2">✖</button></td></tr>`).join(''); }
        function renderAssistencias() { const tb=document.getElementById('tabelaAssistencias'); if(!tb) return; tb.innerHTML=assistencias.map(a=>`<tr><td>${a.data}</td><td>${a.pedidoId}</td><td class="font-black uppercase">${a.cliente}</td><td>${a.produto}</td><td>${a.fabrica}</td><td><button class="status-badge bg-red-600 text-white">${a.status}</button></td><td class="text-center"><button onclick="assistencias=assistencias.filter(x=>x.uid!=${a.uid});salvarCloud();">✖</button></td></tr>`).join(''); }

        function cycleTarefaStatus(u){ const x=tarefas.find(y=>y.uid==u); const s=["Não Iniciado","Em Andamento","Feito"]; x.status=s[(s.indexOf(x.status)+1)%s.length]; salvarCloud(); }
        function cycleStatus(u){ const x=pedidos.find(y=>y.uid==u); const s=["Não enviado","Pedido enviado ao fornecedor","Pedido chegou na loja"]; x.status=s[(s.indexOf(x.status)+1)%s.length]; salvarCloud(); }
        function togglePainelSugestoes(){ const p=document.getElementById('painel-sugestoes'); p.style.display=p.style.display==='flex'?'none':'flex'; }
        function autoSalvarNotas(){ notasMelhoria=document.getElementById('texto-melhorias').value; db.ref('dados/notasMelhoria').set(notasMelhoria); }
        function atualizarSelectsFornecedores(){ const h = fornecedores.map(f => `<option value="${f.nome}">${f.nome}</option>`).join(''); document.getElementById('m_fornecedor_select').innerHTML = h || "<option>...</option>"; if(document.getElementById('as_fabrica')) document.getElementById('as_fabrica').innerHTML = h || "<option>...</option>"; }
        function atualizarSugestoes(){ document.getElementById('listaSugestaoProdutos').innerHTML=catalogo.map(c=>`<option value="${c.nome}">`).join(''); const n=[...new Set(pedidos.map(p=>p.cliente))].sort(); document.getElementById('listaSugestaoClientes').innerHTML=n.map(x=>`<option value="${x}">`).join(''); }
        function calcP(d, pr){ if(!d)return{dias:0,classe:""}; try { const pA=d.split("/"); const dt=new Date(pA[2], pA[1]-1, pA[0]); let dF=new Date(dt); dF.setDate(dF.getDate()+parseInt(pr||30)); const df=Math.ceil((dF-new Date())/86400000); let c=df<0?"prazo-vencido":(df<=5?"prazo-urgente":(df<=10?"prazo-alerta":(df<=20?"prazo-atencao":""))); return {dias:df,classe:c}; } catch(e){return {dias:0,classe:""}} }
        function editField(u,f){ const x=pedidos.find(y=>y.uid==u); let n=prompt(`Editar:`,x[f]||""); if(n!==null){ if(f==='custo') x[f]=n.startsWith("R$")?n:"R$ "+n; else x[f]=n.toUpperCase(); salvarCloud(); } }
        function cadastrarEstoque() { estoque.unshift({ uid: Date.now(), produto: document.getElementById('e_produto').value.toUpperCase(), qtd: document.getElementById('e_qtd').value, situacao: document.getElementById('e_situacao').value }); salvarCloud(); }
        function cadastrarCatalogo() { catalogo.push({ nome: document.getElementById('cat_nome').value.toUpperCase() }); salvarCloud(); }
        function cadastrarFornecedor() { fornecedores.push({ nome: document.getElementById('f_nome').value.toUpperCase(), email: document.getElementById('f_email').value.toLowerCase() }); salvarCloud(); }
        function toggleFiltroNaoEnviado() { filtrandoNaoEnviados=!filtrandoNaoEnviados; document.getElementById('btnFiltroNaoEnviado').classList.toggle('bg-red-600'); renderPedidos(); }
        function limparBusca(){ document.getElementById('busca').value=""; renderPedidos(); }
        function marcarTodos(v){ document.querySelectorAll('#tabelaPedidos input[type=checkbox]').forEach(c=>c.checked=v); }
        function togPed(u,c){ const x=pedidos.find(y=>y.uid==u); if(x) x[c]=!x[c]; salvarCloud(); }
        function excluirPedido(u){ if(confirm("Excluir?")){ pedidos=pedidos.filter(x=>x.uid!=u); salvarCloud(); } }
        function adicionarItemAoCesto() { const p = document.getElementById('m_produto').value.trim().toUpperCase(); if(!p) return; cestoItensTemporario.push({ qtd: document.getElementById('m_qtd').value, produto: p, medida: document.getElementById('m_medida').value, cor: document.getElementById('m_cor').value.toUpperCase(), custo: document.getElementById('m_custo').value }); document.getElementById('cesto-itens').innerText = "Cesto: " + cestoItensTemporario.length + " itens"; document.getElementById('m_produto').value = ""; }
        function cadastrarManual() { const cli = document.getElementById('m_cliente').value.trim().toUpperCase(); const forn = document.getElementById('m_fornecedor_select').value; if(!cli || cestoItensTemporario.length === 0) return alert("Falta preencher!"); const idDoc = "ID#" + proximoID.toString().padStart(4, '0'); proximoID++; const data = new Date().toLocaleDateString('pt-BR'); cestoItensTemporario.forEach(i => pedidos.unshift({ uid: Date.now() + Math.random(), idDoc, cliente: cli, dataPedido: data, qtd: i.qtd, produto: i.produto, medida: i.medida, cor: i.cor, custo: i.custo, fornecedor: forn, prazo: document.getElementById('m_prazo_select').value, status: "Não enviado", whatsEnviado: false, confirmado: false })); cestoItensTemporario = []; document.getElementById('m_cliente').value = ""; document.getElementById('cesto-itens').innerText = ""; salvarCloud(); }
        function gerarEmailLote() { const sels = Array.from(document.querySelectorAll('#tabelaPedidos tr')).filter(r => r.querySelector('input[type=checkbox]')?.checked); if(sels.length === 0) return alert("Selecione os pedidos!"); const fab=sels[0].cells[11].innerText; const fObj=fornecedores.find(x=>x.nome===fab); if(!fObj||!fObj.email) return alert("Fábrica sem e-mail!"); const agora=new Date().getHours(); const saud = agora < 12 ? "Bom dia" : (agora < 18 ? "Boa tarde" : "Boa noite"); let list = sels.map(r => `Qtde: ${r.cells[5].innerText.padStart(2,'0')} - ${r.cells[6].innerText} ${r.cells[7].innerText} ${r.cells[8].innerText} (${r.cells[2].innerText})`).join("\n"); const corpo = `${saud}!\n\nSegue abaixo o pedido para ${fab}:\n\n${list}\n\nFico no aguardo do documento de confirmação com a relação dos itens acima para conferência.\n\nAtenciosamente,\nLucas Mercier.`; window.open(`mailto:${fObj.email}?subject=Pedido Mercier Design&body=${encodeURIComponent(corpo)}`); }

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        document.getElementById('pdfInput').addEventListener('change', async function(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = async function() {
                const pdf = await pdfjsLib.getDocument(new Uint8Array(this.result)).promise;
                let text = ""; for (let i = 1; i <= pdf.numPages; i++) text += (await (await pdf.getPage(i)).getTextContent()).items.map(it => it.str).join(" ");
                const cliente = (text.match(/Cliente\s+(.+?)\s+(?:CPF|CNPJ)/i) || ["","NÃO IDENTIFICADO"])[1].trim();
                const dataP = (text.match(/Data\s+(\d{2}\/\d{2}\/\d{4})/i) || ["",new Date().toLocaleDateString('pt-BR')])[1];
                const bloco = text.substring(text.indexOf("produto/serviço"), text.indexOf("N° de itens"));
                const partes = bloco.split(/(\d{4}\s+(?:UN|PC))/g);
                const idDoc = "ID#" + proximoID.toString().padStart(4, '0'); proximoID++;
                partes.forEach(p => {
                    let d = p.trim(); if(d.length < 5 || /(\d{4}\s+(?:UN|PC))/.test(d)) return;
                    ["Descrição do", "produto/serviço", "Código", "Un.", "Localização", "Qtd.", "Preço de", "lista", "Desc", "%", "Valor", "unitário", "Total"].forEach(l=>d=d.replace(new RegExp(l,"gi"),""));
                    let cor="", med="", prod=d.replace(/[\d\.]+\,\d{2}.*$/g, "").trim();
                    if(prod.includes(" - ")){ const s = prod.split(" - "); cor=s[1].trim(); prod=s[0].trim(); }
                    const m = prod.match(/(\d+[\d\.,\s]*[xX]\s*\d+[\d\.,\s]*|\d+[\.,]\d{2})/i);
                    if(m){ med=m[0].trim(); prod=prod.replace(m[0],"").trim(); }
                    pedidos.unshift({ uid: Date.now() + Math.random(), idDoc, cliente: cliente.toUpperCase(), dataPedido: dataP, qtd: 1, produto: prod.toUpperCase(), medida: med, cor: cor.toUpperCase(), custo: "R$ 0,00", pendencia: "", fornecedor: "", prazo: "30", status: "Não enviado", whatsEnviado: false, confirmado: false });
                });
                salvarCloud();
            };
            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
