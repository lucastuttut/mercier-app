<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercier Design - Gestão Cloud Elite v55.0</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; color: #000; margin: 0; padding: 0; }
        .glass-header { background: #0f172a; border-bottom: 4px solid #3b82f6; }
        .card-premium { background: white; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: 1px solid #e2e8f0; }
        
        .prazo-vencido { background-color: #fecaca !important; border-left: 8px solid #b91c1c !important; animation: pulse-red 2s infinite; }
        .prazo-urgente { background-color: #fee2e2 !important; border-left: 8px solid #ef4444 !important; }
        .prazo-alerta { background-color: #ffedd5 !important; border-left: 8px solid #f97316 !important; }
        .prazo-atencao { background-color: #fef9c3 !important; border-left: 8px solid #eab308 !important; }
        @keyframes pulse-red { 0% { background-color: #fecaca; } 50% { background-color: #f87171; } 100% { background-color: #fecaca; } }

        .status-badge { font-size: 9px; font-weight: 900; padding: 8px; border-radius: 6px; text-transform: uppercase; width: 100%; text-align: center; cursor: pointer; border: none; }
        .btn-sim { background-color: #15803d !important; color: white !important; }
        .btn-nao { background-color: #b91c1c !important; color: white !important; }
        .tab-active { border-bottom: 4px solid #3b82f6; color: #3b82f6; font-weight: 800; }
        
        th { font-size: 10px; font-weight: 900; text-transform: uppercase; color: #64748b; padding: 12px; border-bottom: 2px solid #3b82f6; background: #fff; }
        td { padding: 8px 12px !important; font-weight: 700; color: #0f172a; border-bottom: 1px solid #f1f5f9; }
        input, select, textarea { text-transform: uppercase; outline: none; }
        .editable-cell:hover { background-color: #f8fafc; cursor: pointer; text-decoration: underline; color: #3b82f6; }
        
        #btn-sugestao-flutuante { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; background: #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 15px rgba(59,130,246,0.5); cursor: pointer; z-index: 100; transition: transform 0.2s; }
        #painel-sugestoes { position: fixed; bottom: 90px; right: 24px; width: 320px; height: 450px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 101; display: none; flex-direction: column; border: 1px solid #e2e8f0; }

        .btn-pag-opt { background: #f1f5f9; padding: 6px 12px; border-radius: 8px; font-size: 10px; font-weight: 800; border: 2px solid transparent; transition: 0.2s; }
        .btn-pag-opt.active { background: #3b82f6; color: white; border-color: #2563eb; }
        
        .input-error { border-color: #ef4444 !important; background-color: #fef2f2 !important; }
        .input-success { border-color: #22c55e !important; background-color: #f0fdf4 !important; }
    </style>
</head>
<body>

    <header class="glass-header text-white p-5 shadow-xl flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-2xl font-black tracking-tighter uppercase">MERCIER DESIGN</h1>
        <div id="status-db" class="text-[10px] px-4 py-1.5 rounded-full bg-orange-500 font-black text-white uppercase tracking-widest">Conectando...</div>
    </header>

    <nav class="bg-slate-900 text-slate-400 px-8 flex gap-8 shadow-md overflow-x-auto">
        <button onclick="switchTab('pedidos')" id="tab-pedidos" class="py-4 text-xs font-black uppercase tab-active whitespace-nowrap">📋 Pedidos</button>
        <button onclick="switchTab('tarefas')" id="tab-tarefas" class="py-4 text-xs font-black uppercase whitespace-nowrap">📝 Tarefas</button>
        <button onclick="switchTab('assistencia')" id="tab-assistencia" class="py-4 text-xs font-black uppercase whitespace-nowrap">🛠️ Assistências</button>
        <button onclick="switchTab('estoque')" id="tab-estoque" class="py-4 text-xs font-black uppercase whitespace-nowrap">📦 Estoque</button>
        <button onclick="switchTab('catalogo')" id="tab-catalogo" class="py-4 text-xs font-black uppercase whitespace-nowrap">📜 Catálogo</button>
        <button onclick="switchTab('fornecedores')" id="tab-fornecedores" class="py-4 text-xs font-black uppercase whitespace-nowrap">🏭 Fábricas</button>
    </nav>

    <!-- ABA PEDIDOS -->
    <main id="view-pedidos" class="max-w-[1950px] mx-auto p-4 md:p-6">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-6">
            <div class="card-premium p-4 flex flex-col justify-center bg-slate-50 border-2 border-dashed border-slate-300">
                <input type="file" id="pdfInput" accept="application/pdf" class="text-[10px] cursor-pointer">
            </div>
            <div class="lg:col-span-3 card-premium p-5 border-l-8 border-blue-600">
                <div class="flex flex-wrap gap-3 mb-4">
                    <input list="listaSugestaoClientes" id="m_cliente" placeholder="NOME DO CLIENTE" class="border-2 p-2 rounded-lg text-xs font-bold flex-1 outline-blue-500">
                    <select id="m_prazo_select" class="border-2 p-2 rounded-lg text-xs font-bold w-32 bg-white">
                        <option value="15">15 Dias</option><option value="20">20 Dias</option><option value="30" selected>30 Dias</option><option value="30-util">30 Úteis</option><option value="40-util">40 Úteis</option>
                    </select>
                    <select id="m_fornecedor_select" class="border-2 p-2 rounded-lg text-xs font-bold w-48 bg-white"></select>
                </div>
                <div class="flex flex-wrap gap-2 mb-3 bg-slate-50 p-3 rounded-xl border">
                    <input type="number" id="m_qtd" value="1" class="border-2 p-1.5 rounded-lg text-xs font-bold w-16">
                    <input list="listaSugestaoProdutos" id="m_produto" placeholder="PRODUTO" class="border-2 p-1.5 rounded-lg text-xs font-bold flex-1">
                    <input type="text" id="m_medida" placeholder="MEDIDA" class="border-2 p-1.5 rounded-lg text-xs font-bold w-24">
                    <input type="text" id="m_cor" placeholder="COR/TECIDO" class="border-2 p-1.5 rounded-lg text-xs font-bold w-32">
                    <input type="text" id="m_custo" placeholder="R$ CUSTO" class="border-2 p-1.5 rounded-lg text-xs font-bold w-24" oninput="maskMoney(this)">
                    <input type="text" id="m_pendencia" placeholder="O QUE FALTA?" class="border-2 p-1.5 rounded-lg text-xs font-bold flex-1">
                    <button onclick="adicionarItemAoCesto()" class="bg-slate-800 text-white px-6 rounded-lg text-[10px] font-black hover:bg-black transition">＋ ITEM</button>
                </div>
                <div id="cesto-itens" class="text-[11px] font-bold text-blue-600 mb-3 italic px-2"></div>
                <button onclick="cadastrarManual()" class="bg-blue-600 text-white font-black rounded-xl text-xs px-8 py-3.5 w-full uppercase shadow-lg hover:bg-blue-700 transition">Finalizar e Sincronizar Pedido</button>
            </div>
        </div>

        <div class="card-premium overflow-hidden">
            <div class="p-4 bg-white border-b flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <div class="relative flex-1 md:flex-none">
                        <input type="text" id="busca" onkeyup="renderPedidos()" placeholder="🔍 BUSCAR CLIENTE, FÁBRICA OU PRODUTO..." class="border-2 border-slate-100 px-5 py-2.5 rounded-2xl text-xs w-full md:w-96 font-bold outline-blue-500">
                        <button onclick="limparBusca()" class="absolute right-4 top-2.5 text-slate-400 font-bold">✕</button>
                    </div>
                    <button onclick="gerarEmailLote()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-[10px] font-black uppercase shadow hover:bg-emerald-700">📧 Enviar Selecionados</button>
                    <span id="total-selecionado" class="text-[10px] font-black text-emerald-700 bg-emerald-50 px-3 py-2 rounded-lg border border-emerald-200 hidden uppercase tracking-tighter">TOTAL: R$ 0,00</span>
                </div>
                <span id="contador" class="text-[10px] font-black bg-slate-900 text-white px-4 py-2 rounded-lg uppercase">0 Pedidos</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr>
                            <th width="40"><input type="checkbox" onclick="marcarTodos(this.checked)"></th>
                            <th>Prazo</th><th>ID</th><th>Cliente</th><th>Data</th><th>Qtd</th><th>Móvel</th><th>Medida</th><th>Cor</th><th>Custo</th><th>Fábrica</th><th>Status</th><th>Whats?</th><th>Conf?</th><th class="text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaPedidos"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- ABA TAREFAS -->
    <main id="view-tarefas" class="hidden max-w-[1200px] mx-auto p-4 md:p-6">
        <div class="card-premium p-6 border-l-8 border-indigo-600 mb-6">
            <h2 class="text-xs font-black text-slate-400 uppercase mb-4 tracking-wider">Gestão de Atividades</h2>
            <div class="flex flex-col md:flex-row gap-4 mb-4">
                <div class="flex flex-col w-full md:w-72">
                    <label class="text-[9px] font-black ml-1 mb-1 uppercase text-indigo-600">Tipo de Tarefa</label>
                    <select id="t_tipo" onchange="mostrarCamposTarefa(this.value)" class="border-2 p-3 rounded-xl text-xs font-bold bg-white outline-indigo-500">
                        <option value="SIMPLES">Anotação Simples</option>
                        <option value="TIRAR PEDIDO">Tirar Pedido</option>
                        <option value="MARCAR ENTREGA">Marcar Entrega</option>
                        <option value="RETORNO CLIENTE">Dar Retorno para Cliente</option>
                    </select>
                </div>
            </div>
            <div id="container-campos-tarefa" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
            <div class="mt-6 flex gap-3">
                <button onclick="cadastrarTarefa()" class="bg-indigo-600 text-white font-black px-12 py-3.5 rounded-xl text-xs uppercase shadow-lg hover:bg-indigo-700 transition">Salvar na Lista</button>
            </div>
        </div>

        <div class="card-premium overflow-hidden">
            <div class="p-4 bg-white border-b flex flex-wrap justify-between items-center gap-4">
                <select id="filtro-tarefa" onchange="renderTarefas()" class="border-2 p-2 rounded-lg text-[10px] font-black uppercase bg-white"><option value="TODAS">Ver Todas</option><option value="Não Iniciado">Não Iniciado</option><option value="Em Andamento">Em Andamento</option><option value="Feito">Feito</option></select>
                <button onclick="gerarFechamentoDiario()" class="bg-slate-900 text-white px-4 py-2 rounded-lg text-[10px] font-black uppercase shadow">📊 Relatório do Dia</button>
            </div>
            <table class="w-full text-left">
                <thead><tr class="bg-slate-50"><th>Data</th><th>Tarefa</th><th>Tipo</th><th>Status</th><th class="text-center">Ações</th></tr></thead>
                <tbody id="tabelaTarefas"></tbody>
            </table>
        </div>
    </main>

    <!-- ABA ASSISTÊNCIA, ESTOQUE, CATALOGO, FORNECEDORES (RESTAURADAS) -->
    <main id="view-assistencia" class="hidden max-w-[1950px] mx-auto p-4 md:p-6">
        <div class="card-premium p-6 border-l-8 border-orange-500 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-3">
                <input list="listaSugestaoClientes" id="as_cliente" placeholder="CLIENTE" class="border-2 p-2 rounded-lg text-xs font-bold">
                <input type="text" id="as_pedido_id" placeholder="ID PEDIDO" class="border-2 p-2 rounded-lg text-xs font-bold">
                <input type="text" id="as_produto" placeholder="PRODUTO" class="border-2 p-2 rounded-lg text-xs font-bold">
                <select id="as_fabrica" class="border-2 p-2 rounded-lg text-xs font-bold bg-white"></select>
            </div>
            <textarea id="as_descricao" placeholder="RELATO DO PROBLEMA..." class="w-full border-2 p-3 rounded-lg text-xs font-bold h-24 mb-3 uppercase"></textarea>
            <button onclick="cadastrarAssistencia()" class="bg-orange-600 text-white font-black px-8 py-3 rounded-xl text-xs uppercase shadow-md hover:bg-orange-700 transition">Registrar Assistência</button>
        </div>
        <div class="card-premium overflow-hidden"><table class="w-full text-left"><thead><tr><th>Data</th><th>Pedido</th><th>Cliente</th><th>Produto</th><th>Fábrica</th><th>Status</th><th class="text-center">Ações</th></tr></thead><tbody id="tabelaAssistencias"></tbody></table></div>
    </main>

    <main id="view-estoque" class="hidden max-w-[1950px] mx-auto p-6">
        <div class="card-premium p-6 mb-8 border-l-8 border-blue-600 flex flex-wrap gap-3 items-end">
            <div class="flex flex-col flex-1"><label class="text-[9px] font-black ml-1">PRODUTO</label><input list="listaSugestaoProdutos" id="e_produto" class="border-2 p-2 rounded-lg text-xs font-bold"></div>
            <div class="flex flex-col w-32"><label class="text-[9px] font-black ml-1">COR</label><input type="text" id="e_cor" class="border-2 p-2 rounded-lg text-xs font-bold"></div>
            <div class="flex flex-col w-32"><label class="text-[9px] font-black ml-1">MEDIDA</label><input type="text" id="e_medida" class="border-2 p-2 rounded-lg text-xs font-bold"></div>
            <div class="flex flex-col w-40"><label class="text-[9px] font-black ml-1">FÁBRICA</label><select id="e_fornecedor_select" class="border-2 p-2 rounded-lg text-xs font-bold bg-white"></select></div>
            <div class="flex flex-col w-40"><label class="text-[9px] font-black ml-1">SITUAÇÃO</label><select id="e_situacao" class="border-2 p-2 rounded-lg text-xs font-bold bg-white"><option value="ESTOQUE">ESTOQUE</option><option value="VENDIDO">VENDIDO</option></select></div>
            <div class="flex flex-col w-20"><label class="text-[9px] font-black ml-1">QTD</label><input type="number" id="e_qtd" value="1" class="border-2 p-2 rounded-lg text-xs font-bold"></div>
            <button onclick="cadastrarEstoque()" class="bg-blue-600 text-white font-black px-6 py-2.5 rounded-lg text-xs uppercase h-[42px]">Add</button>
        </div>
        <div class="card-premium overflow-hidden"><table class="w-full text-left"><thead><tr class="bg-slate-50"><th>Móvel</th><th>Cor</th><th>Qtd</th><th>Status</th><th class="text-center">Ações</th></tr></thead><tbody id="tabelaEstoque"></tbody></table></div>
    </main>

    <main id="view-fornecedores" class="hidden max-w-4xl mx-auto p-6">
        <div class="card-premium p-6 mb-6 border-l-8 border-blue-600 flex flex-wrap gap-2">
            <input type="text" id="f_nome" placeholder="NOME DA FÁBRICA" class="border-2 p-2 rounded-lg flex-1 font-bold">
            <input type="email" id="f_email" placeholder="E-MAIL" class="border-2 p-2 rounded-lg flex-1 font-bold lowercase">
            <button onclick="cadastrarFornecedor()" class="bg-blue-600 text-white px-8 py-2 rounded font-black text-xs uppercase">Salvar</button>
        </div>
        <div class="card-premium overflow-hidden"><table class="w-full text-left"><thead><tr class="bg-slate-50"><th>Fábrica</th><th>E-mail</th><th class="text-center">Remover</th></tr></thead><tbody id="tabelaFornecedores"></tbody></table></div>
    </main>

    <!-- BALÃO FLUTUANTE DE SUGESTÕES -->
    <div id="btn-sugestao-flutuante" onclick="togglePainelSugestoes()">💡</div>
    <div id="painel-sugestoes">
        <div class="bg-blue-600 p-4 text-white font-black text-[10px] flex justify-between items-center uppercase tracking-widest">
            <span>💡 Sugestões e Notas</span>
            <button onclick="togglePainelSugestoes()">✕</button>
        </div>
        <textarea id="texto-melhorias" class="flex-1 p-4 text-sm font-bold uppercase border-0 outline-none resize-none" oninput="autoSalvarNotas()"></textarea>
    </div>

    <datalist id="listaSugestaoProdutos"></datalist>
    <datalist id="listaSugestaoClientes"></datalist>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA_fQSZJJcz5Wszw54W5EhMN9D5rNnjoCo",
            authDomain: "mercier-design.firebaseapp.com",
            projectId: "mercier-design",
            storageBucket: "mercier-design.firebasestorage.app",
            messagingSenderId: "1060891658513",
            appId: "1:1060891658513:web:2eefd15227203af39064b0",
            databaseURL: "https://mercier-design-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let pedidos = [], fornecedores = [], estoque = [], catalogo = [], assistencias = [], tarefas = [], proximoID = 255, notasMelhoria = "";
        let selecionados = [], cpfValido = true;

        db.ref('dados').on('value', (s) => {
            const data = s.val();
            if(data) {
                pedidos = data.pedidos || []; fornecedores = data.fornecedores || []; estoque = data.estoque || []; catalogo = data.catalogo || []; assistencias = data.assistencias || []; tarefas = data.tarefas || []; proximoID = data.proximoID || 255; notasMelhoria = data.notasMelhoria || "";
                document.getElementById('status-db').innerText = "SINCRONIZADO";
                document.getElementById('status-db').className = "text-[10px] px-4 py-1.5 rounded-full bg-green-600 font-black text-white uppercase";
                document.getElementById('texto-melhorias').value = notasMelhoria;
                atualizarSugestoes(); atualizarSelectsFornecedores(); renderPedidos(); renderEstoque(); renderAssistencias(); renderTarefas();
            }
        });

        function salvarCloud() { db.ref('dados').set({ pedidos, fornecedores, estoque, catalogo, assistencias, tarefas, proximoID, notasMelhoria }); }

        // --- MÁSCARAS ---
        function maskMoney(i) { let v = i.value.replace(/\D/g, ""); v = (v/100).toFixed(2).replace(".",","); v = v.replace(/(\d)(?=(\d{3})+(?!\d))/g,"$1."); i.value="R$ "+v; if(i.classList.contains('t-v-desc')) calcularTotalPedidoTarefa(); }
        function maskCPF(i) { let v = i.value.replace(/\D/g, ""); if (v.length > 11) v = v.slice(0, 11); v = v.replace(/(\d{3})(\d)/, "$1.$2"); v = v.replace(/(\d{3})(\d)/, "$1.$2"); v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2"); i.value = v; if(v.length === 14) verificarCPF(i); }
        function validarCPF(cpf) { cpf = cpf.replace(/[^\d]+/g,''); if(cpf.length !== 11 || !!cpf.match(/(\d)\1{10}/)) return false; let add = 0; for (let i=0; i < 9; i ++) add += parseInt(cpf.charAt(i)) * (10 - i); let rev = 11 - (add % 11); if (rev === 10 || rev === 11) rev = 0; if (rev !== parseInt(cpf.charAt(9))) return false; add = 0; for (let i = 0; i < 10; i ++) add += parseInt(cpf.charAt(i)) * (11 - i); rev = 11 - (add % 11); if (rev === 10 || rev === 11) rev = 0; if (rev !== parseInt(cpf.charAt(10))) return false; return true; }
        function verificarCPF(i) { const label = document.getElementById('label-cpf-status'); if(validarCPF(i.value)) { i.classList.remove('input-error'); i.classList.add('input-success'); if(label) label.innerText = "OK"; cpfValido = true; } else { i.classList.add('input-error'); if(label) label.innerText = "INVÁLIDO!"; cpfValido = false; } }
        async function buscarCEP(i) { const c = i.value.replace(/\D/g,""); if(c.length===8) { try { const r = await fetch(`https://viacep.com.br/ws/${c}/json/`); const d = await r.json(); if(!d.erro){ document.getElementById('t_end').value=d.logradouro.toUpperCase(); document.getElementById('t_bairro').value=d.bairro.toUpperCase(); } } catch(e){} } }

        // --- TAREFAS ---
        function mostrarCamposTarefa(t) {
            const c = document.getElementById('container-campos-tarefa'); c.innerHTML = "";
            if(t==='TIRAR PEDIDO') {
                c.innerHTML = `<div class="flex flex-col"><label class="text-[9px] font-black ml-1">NOME COMPLETO</label><input type="text" id="t_nome" class="border-2 p-2 rounded-lg text-xs font-bold"></div>
                <div class="flex flex-col"><label class="text-[9px] font-black ml-1 uppercase">CPF <span id="label-cpf-status"></span></label><input type="text" id="t_cpf" class="border-2 p-2 rounded-lg text-xs font-bold" oninput="maskCPF(this)"></div>
                <div class="flex flex-col"><label class="text-[9px] font-black ml-1 uppercase">CEP</label><input type="text" id="t_cep" class="border-2 p-2 rounded-lg text-xs font-bold" oninput="buscarCEP(this)"></div>
                <div class="col-span-2 flex flex-col"><label class="text-[9px] font-black ml-1 uppercase">ENDEREÇO</label><input type="text" id="t_end" class="border-2 p-2 rounded-lg text-xs font-bold"></div>
                <div class="flex flex-col"><label class="text-[9px] font-black ml-1 uppercase">BAIRRO</label><input type="text" id="t_bairro" class="border-2 p-2 rounded-lg text-xs font-bold"></div>
                <div class="flex flex-col"><label class="text-[9px] font-black ml-1 uppercase">NÚMERO</label><input type="text" id="t_num" class="border-2 p-2 rounded-lg text-xs font-bold"></div>
                <div class="flex flex-col"><label class="text-[9px] font-black ml-1 uppercase">TORRE/APTO</label><input type="text" id="t_torre" class="border-2 p-2 rounded-lg text-xs font-bold"></div>
                <div class="flex flex-col"><label class="text-[9px] font-black ml-1 uppercase">CONTATO</label><input type="text" id="t_contato" class="border-2 p-2 rounded-lg text-xs font-bold"></div>
                <div class="col-span-3 border-t mt-2 pt-2"><div id="lista-prods-t" class="space-y-2"><div class="flex gap-2 items-end"><div class="flex-1 flex flex-col"><label class="text-[8px] font-bold">PRODUTO</label><input type="text" class="t-prod border-2 p-2 rounded text-xs font-bold"></div><div class="w-24 flex flex-col"><label class="text-[8px] font-bold">ORIGINAL</label><input type="text" class="t-v-orig border-2 p-2 rounded text-xs font-bold" oninput="maskMoney(this)"></div><div class="w-24 flex flex-col"><label class="text-[8px] font-bold">DESC.</label><input type="text" class="t-v-desc border-2 p-2 rounded text-xs font-bold" oninput="maskMoney(this)"></div><button onclick="this.parentElement.remove(); calcularTotalPedidoTarefa();">✖</button></div></div><button onclick="addProdT()" class="text-[9px] font-bold text-blue-600 mt-2">+ PRODUTO</button><div id="total-pedido-tarefa" class="text-xs font-black mt-2 text-indigo-600">TOTAL: R$ 0,00</div></div>
                <div class="col-span-3 border-t mt-2 pt-2"><div id="lista-pags-t" class="space-y-2"><div class="flex flex-col gap-2 p-2 bg-slate-50 rounded-lg border"><div class="flex gap-1 flex-wrap"><button onclick="setPag(this,'PIX')" class="btn-pag-opt active">PIX</button><button onclick="setPag(this,'CRÉDITO')" class="btn-pag-opt">CRÉDITO</button><button onclick="setPag(this,'DÉBITO')" class="btn-pag-opt">DÉBITO</button><button onclick="setPag(this,'CHEQUE')" class="btn-pag-opt">CHEQUE</button><input type="hidden" class="t-p-forma" value="PIX"></div><div class="flex gap-2"><input type="text" placeholder="VALOR" class="t-p-val border-2 p-1.5 rounded text-xs font-bold flex-1" oninput="maskMoney(this)"><input type="text" placeholder="DATA" class="t-p-data border-2 p-1.5 rounded text-xs font-bold w-32"></div></div></div><button onclick="addPagT()" class="text-[9px] font-bold text-blue-600 mt-2">+ PAGAMENTO</button></div>
                <textarea id="t_obs" placeholder="OBS..." class="col-span-3 border-2 p-2 rounded text-xs font-bold h-16 mt-2"></textarea>`;
            } else if(t==='SIMPLES') c.innerHTML = `<div class="col-span-3"><input type="text" id="t_desc_raw" placeholder="DESCREVA A TAREFA..." class="border-2 p-3 rounded-xl text-xs font-bold w-full"></div>`;
            else c.innerHTML = `<input type="text" id="t_cli" placeholder="CLIENTE" class="border-2 p-2 rounded text-xs font-bold"><input type="text" id="t_info" placeholder="DETALHES..." class="border-2 p-2 rounded text-xs font-bold col-span-2">`;
        }

        function addProdT() { const d = document.getElementById('lista-prods-t'); const r = document.createElement('div'); r.className="flex gap-2 items-end"; r.innerHTML = `<div class="flex-1 flex flex-col"><label class="text-[8px] font-bold">PRODUTO</label><input type="text" class="t-prod border-2 p-2 rounded text-xs font-bold"></div><div class="w-24 flex flex-col"><label class="text-[8px] font-bold">ORIGINAL</label><input type="text" class="t-v-orig border-2 p-2 rounded text-xs font-bold" oninput="maskMoney(this)"></div><div class="w-24 flex flex-col"><label class="text-[8px] font-bold">DESC.</label><input type="text" class="t-v-desc border-2 p-2 rounded text-xs font-bold" oninput="maskMoney(this)"></div><button onclick="this.parentElement.remove(); calcularTotalPedidoTarefa();">✖</button>`; d.appendChild(r); }
        function addPagT() { const d = document.getElementById('lista-pags-t'); const r = document.createElement('div'); r.className="flex flex-col gap-2 p-2 bg-slate-50 rounded-lg border mt-2"; r.innerHTML = `<div class="flex gap-1 flex-wrap"><button onclick="setPag(this,'PIX')" class="btn-pag-opt active">PIX</button><button onclick="setPag(this,'CRÉDITO')" class="btn-pag-opt">CRÉDITO</button><button onclick="setPag(this,'DÉBITO')" class="btn-pag-opt">DÉBITO</button><button onclick="setPag(this,'CHEQUE')" class="btn-pag-opt">CHEQUE</button><input type="hidden" class="t-p-forma" value="PIX"></div><div class="flex gap-2"><input type="text" placeholder="VALOR" class="t-p-val border-2 p-1.5 rounded text-xs font-bold flex-1" oninput="maskMoney(this)"><input type="text" placeholder="DATA" class="t-p-data border-2 p-1.5 rounded text-xs font-bold w-32"><button onclick="this.parentElement.parentElement.remove()">✖</button></div>`; d.appendChild(r); }
        function setPag(b,v){ b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); b.parentElement.querySelector('input').value=v; }
        function calcularTotalPedidoTarefa() { let t=0; document.querySelectorAll('.t-v-desc').forEach(i=>{ let v=i.value.replace("R$ ","").replace(/\./g,"").replace(",","."); t+=parseFloat(v)||0; }); document.getElementById('total-pedido-tarefa').innerText="TOTAL: R$ "+t.toLocaleString('pt-BR',{minimumFractionDigits:2}); }
        
        function cadastrarTarefa() { 
            const tipo = document.getElementById('t_tipo').value; 
            if(tipo === 'TIRAR PEDIDO' && !cpfValido) return alert("CPF INVÁLIDO!");
            let d = ""; if(tipo==='SIMPLES') d=document.getElementById('t_desc_raw').value; else if(tipo==='TIRAR PEDIDO') d="PEDIDO: "+document.getElementById('t_nome').value+" - "+Array.from(document.querySelectorAll('.t-prod')).map(i=>i.value).filter(v=>v).join(", "); else d=tipo+": "+(document.getElementById('t_cli')?.value||""); if(!d) return alert("Preencha!");
            tarefas.unshift({uid:Date.now(), data:new Date().toLocaleDateString('pt-BR'), tipo, descricao:d.toUpperCase(), status:"Não Iniciado"}); salvarCloud(); mostrarCamposTarefa(tipo); 
        }
        function renderTarefas() { const tb=document.getElementById('tabelaTarefas'); if(!tb) return; const f=document.getElementById('filtro-tarefa').value; let l=f==='TODAS'?tarefas:tarefas.filter(x=>x.status===f); tb.innerHTML=l.map(x=>{ let sCls=x.status==='Feito'?'bg-green-600':(x.status==='Em Andamento'?'bg-orange-500':'bg-slate-400'); return `<tr><td>${x.data}</td><td class="font-black text-xs uppercase">${x.descricao}</td><td class="text-[9px] font-black opacity-50 uppercase">${x.tipo}</td><td><button onclick="cycleTarefaStatus(${x.uid})" class="status-badge ${sCls} text-white">${x.status}</button></td><td class="text-center"><button onclick="tarefas=tarefas.filter(y=>y.uid!=${x.uid});salvarCloud();" class="text-red-500 font-bold">✖</button></td></tr>`; }).join(''); }
        function cycleTarefaStatus(uid){ const x=tarefas.find(y=>y.uid==uid); const s=["Não Iniciado","Em Andamento","Feito"]; x.status=s[(s.indexOf(x.status)+1)%s.length]; salvarCloud(); }
        function gerarFechamentoDiario() { const h=new Date().toLocaleDateString('pt-BR'); const c=tarefas.filter(x=>x.status==='Feito'&&x.data===h); if(c.length===0) return alert("Nada feito hoje."); let r=`📊 RELATÓRIO ${h}\n\n`; c.forEach((x,i)=>r+=`${i+1}. [${x.tipo}] ${x.descricao}\n`); alert(r); }

        // --- SISTEMA ---
        function switchTab(t){ document.querySelectorAll('main').forEach(x=>x.classList.add('hidden')); document.getElementById('view-'+t).classList.remove('hidden'); document.querySelectorAll('nav button').forEach(x=>x.classList.remove('tab-active')); document.getElementById('tab-'+t).classList.add('tab-active'); if(t==='tarefas') mostrarCamposTarefa(document.getElementById('t_tipo').value); if(t==='pedidos') renderPedidos(); }
        function togglePainelSugestoes(){ const p=document.getElementById('painel-sugestoes'); p.style.display=p.style.display==='flex'?'none':'flex'; }
        function autoSalvarNotas(){ notasMelhoria=document.getElementById('texto-melhorias').value; db.ref('dados/notasMelhoria').set(notasMelhoria); }
        function marcarTodos(v){ selecionados=v?pedidos.map(x=>x.uid):[]; calcularTotalSelecionado(); renderPedidos(); }
        function toggleSelecionado(u){ if(selecionados.includes(u)) selecionados=selecionados.filter(x=>x!==u); else selecionados.push(u); calcularTotalSelecionado(); }
        function calcularTotalSelecionado() { const el=document.getElementById('total-selecionado'); if(selecionados.length===0){ el.classList.add('hidden'); return; } const t=pedidos.filter(p=>selecionados.includes(p.uid)).reduce((acc,p)=>acc+(parseFloat(p.custo)||0),0); el.innerText=`TOTAL: R$ ${t.toLocaleString('pt-BR',{minimumFractionDigits:2})}`; el.classList.remove('hidden'); }
        function limparBusca(){ document.getElementById('busca').value=""; renderPedidos(); }
        function updPed(u,c,v){ pedidos.find(x=>x.uid==u)[c]=v; salvarCloud(); }
        function togPed(u,c){ const x=pedidos.find(y=>y.uid==u); if(x) x[c]=!x[c]; salvarCloud(); }
        function cycleStatus(u){ const x=pedidos.find(y=>y.uid==u); const s=["Não enviado","Pedido enviado ao fornecedor","Pedido chegou na loja"]; x.status=s[(s.indexOf(x.status)+1)%s.length]; salvarCloud(); }
        function renderPedidos() {
            const tb=document.getElementById('tabelaPedidos'); if(!tb) return;
            const b=document.getElementById('busca').value.toLowerCase();
            let l=pedidos.filter(x=>(x.cliente||"").toLowerCase().includes(b)||(x.produto||"").toLowerCase().includes(b)||(x.idDoc||"").toLowerCase().includes(b)||(x.fornecedor||"").toLowerCase().includes(b));
            document.getElementById('contador').innerText=l.length+" PEDIDOS";
            tb.innerHTML = l.map(x=>{
                const p=calcP(x.dataPedido,x.prazo);
                let sCls=x.status==="Não enviado"?"bg-red-600":(x.status.includes("enviado")?"bg-blue-600":"bg-green-700");
                return `<tr class="${p.classe}"><td><input type="checkbox" ${selecionados.includes(x.uid)?'checked':''} onclick="toggleSelecionado(${x.uid})"></td><td><div class="flex flex-col gap-1"><span class="bg-black text-white text-[9px] px-1 text-center rounded font-black">${p.dias}D</span><select onchange="updPed(${x.uid},'prazo',this.value)" class="bg-black text-white text-[9px] rounded"><option value="15" ${x.prazo=='15'?'selected':''}>15C</option><option value="30" ${x.prazo=='30'?'selected':''}>30C</option></select></div></td><td class="text-xs text-slate-500 font-bold">${x.idDoc}</td><td onclick="editField(${x.uid},'cliente')" class="editable-cell uppercase">${x.cliente}</td><td onclick="editField(${x.uid},'dataPedido')" class="editable-cell text-[10px]">${x.dataPedido}</td><td onclick="editField(${x.uid},'qtd')" class="editable-cell text-center font-black">${x.qtd}</td><td onclick="editField(${x.uid},'produto')" class="editable-cell uppercase text-[11px]">${x.produto}</td><td onclick="editField(${x.uid},'medida')" class="editable-cell text-[10px]">${x.medida||'-'}</td><td onclick="editField(${x.uid},'cor')" class="editable-cell uppercase text-[10px]">${x.cor||'-'}</td><td onclick="editField(${x.uid},'custo')" class="editable-cell text-[10px]">R$ ${parseFloat(x.custo||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}</td><td onclick="editField(${x.uid},'pendencia')" class="editable-cell text-[9px] text-red-600 italic font-black">${x.pendencia||"-"}</td><td class="text-[10px] uppercase font-black text-blue-800">${x.fornecedor||'-'}</td><td><button onclick="cycleStatus(${x.uid})" class="status-badge ${sCls} text-white">${x.status}</button></td><td><button onclick="togPed(${x.uid},'whatsEnviado')" class="status-badge ${x.whatsEnviado?'btn-sim':'btn-nao'} font-black">${x.whatsEnviado?'SIM':'NÃO'}</button></td><td><button onclick="togPed(${x.uid},'confirmado')" class="status-badge ${x.confirmado?'btn-sim':'btn-nao'} font-black">${x.confirmado?'SIM':'NÃO'}</button></td><td><div class="flex gap-2"><button onclick="copiarTexto(${x.uid})">📋</button><button onclick="dupPed(${x.uid})">➕</button><button onclick="gerarAssistenciaRapida(${x.uid})">🛠️</button><button onclick="excluirPedido(${x.uid})" class="text-red-500">✖</button></div></td></tr>`;
            }).join('');
        }
        function calcP(d, pr){ if(!d)return{dias:0,classe:""}; try { const pA=d.split("/"); const dt=new Date(pA[2], pA[1]-1, pA[0]); let dF=new Date(dt); dF.setDate(dF.getDate()+parseInt(pr||30)); const df=Math.ceil((dF-new Date())/86400000); let c=df<0?"prazo-vencido":(df<=5?"prazo-urgente":(df<=10?"prazo-alerta":(df<=20?"prazo-atencao":""))); return {dias:df,classe:c}; } catch(e){return {dias:0,classe:""}} }
        function editField(u,f){ const x=pedidos.find(y=>y.uid==u); let n=prompt(`Editar:`,x[f]||""); if(n!==null){ if(f==='qtd'||f==='custo') x[f]=parseFloat(n.replace(',','.')); else x[f]=n.toUpperCase(); salvarCloud(); } }
        function renderEstoque() { const tb = document.getElementById('tabelaEstoque'); if(!tb) return; tb.innerHTML = estoque.map(i => `<tr><td class="font-black text-xs uppercase">${i.produto}</td><td>${i.qtd}</td><td>${i.situacao}</td><td><button onclick="estoque=estoque.filter(x=>x.uid!=${i.uid});salvarCloud();">✖</button></td></tr>`).join(''); }
        function renderAssistencias() { const tb = document.getElementById('tabelaAssistencias'); if(!tb) return; tb.innerHTML = assistencias.map(a => `<tr><td>${a.data}</td><td>${a.cliente}</td><td>${a.status}</td></tr>`).join(''); }
        function atualizarSelectsFornecedores(){ const h = fornecedores.map(f => `<option value="${f.nome}">${f.nome}</option>`).join(''); if(document.getElementById('m_fornecedor_select')) document.getElementById('m_fornecedor_select').innerHTML = h || "<option>...</option>"; if(document.getElementById('as_fabrica')) document.getElementById('as_fabrica').innerHTML = h || "<option>...</option>"; }
        function atualizarSugestoes(){ document.getElementById('listaSugestaoProdutos').innerHTML=catalogo.map(c=>`<option value="${c.nome}">`).join(''); const n=[...new Set(pedidos.map(p=>p.cliente))].sort(); document.getElementById('listaSugestaoClientes').innerHTML=n.map(x=>`<option value="${x}">`).join(''); }
        function copiarTexto(uid) { const p = pedidos.find(x => x.uid == uid); const itens = pedidos.filter(i => i.idDoc === p.idDoc); let t = itens.map(i => `${i.qtd}x ${i.produto} (${i.medida}) ${i.cor}`).join("\n"); navigator.clipboard.writeText(t + "\n" + p.idDoc); alert("Copiado!"); }
        function gerarAssistenciaRapida(uid) { const p = pedidos.find(x => x.uid == uid); if(!p) return; document.getElementById('as_cliente').value = p.cliente; document.getElementById('as_pedido_id').value = p.idDoc; document.getElementById('as_produto').value = `${p.produto} - ${p.cor} (${p.medida})`; switchTab('assistencia'); }
        function gerarEmailLote() { if(selecionados.length === 0) return alert("Selecione os pedidos!"); const itens = pedidos.filter(p => selecionados.includes(p.uid)); const fabricaNome = itens[0].fornecedor; if(!itens.every(p => p.fornecedor === fabricaNome)) return alert("Selecione apenas uma fábrica!"); const fObj = fornecedores.find(f => f.nome === fabricaNome); if(!fObj || !fObj.email) return alert("Fábrica sem e-mail!"); const agora = new Date().getHours(); const saudacao = agora < 12 ? "Bom dia" : (agora < 18 ? "Boa tarde" : "Boa noite"); let lista = itens.map(i => `Qtde: ${i.qtd.toString().padStart(2,'0')} - ${i.produto} ${i.medida} ${i.cor} (${i.idDoc})`).join("\n"); const corpo = `${saudacao}!\n\nSegue abaixo o pedido para ${fabricaNome}:\n\n${lista}\n\nFico no aguardo do documento de confirmação com a relação dos itens acima para conferência.\n\nObs: IDS para controle interno, favor desconsiderar.\n\nAtenciosamente,\nLucas Mercier.`; window.open(`mailto:${fObj.email}?subject=Pedido Mercier Design&body=${encodeURIComponent(corpo)}`); }

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        document.getElementById('pdfInput').addEventListener('change', async function(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = async function() {
                const pdf = await pdfjsLib.getDocument(new Uint8Array(this.result)).promise;
                let text = ""; for (let i = 1; i <= pdf.numPages; i++) text += (await (await pdf.getPage(i)).getTextContent()).items.map(it => it.str).join(" ");
                const cliente = (text.match(/Cliente\s+(.+?)\s+(?:CPF|CNPJ)/i) || ["","NÃO IDENTIFICADO"])[1].trim();
                const dataP = (text.match(/Data\s+(\d{2}\/\d{2}\/\d{4})/i) || ["",new Date().toLocaleDateString('pt-BR')])[1];
                const bloco = text.substring(text.indexOf("produto/serviço"), text.indexOf("N° de itens"));
                const partes = bloco.split(/(\d{4}\s+(?:UN|PC))/g);
                const idDoc = "ID#" + proximoID.toString().padStart(4, '0'); proximoID++;
                partes.forEach(p => {
                    let d = p.trim(); if(d.length < 5 || /(\d{4}\s+(?:UN|PC))/.test(d)) return;
                    ["Descrição do", "produto/serviço", "Código", "Un.", "Localização", "Qtd.", "Preço de", "lista", "Desc", "%", "Valor", "unitário", "Total"].forEach(l=>d=d.replace(new RegExp(l,"gi"),""));
                    let cor="", med="", prod=d.replace(/[\d\.]+\,\d{2}.*$/g, "").trim();
                    if(prod.includes(" - ")){ const s = prod.split(" - "); cor=s[1].trim(); prod=s[0].trim(); }
                    const m = prod.match(/(\d+[\d\.,\s]*[xX]\s*\d+[\d\.,\s]*|\d+[\.,]\d{2})/i);
                    if(m){ med=m[0].trim(); prod=prod.replace(m[0],"").trim(); }
                    pedidos.unshift({ uid: Date.now() + Math.random(), idDoc, cliente: cliente.toUpperCase(), dataPedido: dataP, qtd: 1, produto: prod.toUpperCase(), medida: med, cor: cor.toUpperCase(), custo: 0, pendencia: "", fornecedor: document.getElementById('m_fornecedor_select').value, prazo: "30", status: "Não enviado", whatsEnviado: false, confirmado: false });
                });
                salvarCloud();
            };
            reader.readAsArrayBuffer(file);
        });
    </script>
